rules_clarifications:
  - topic: "Favour"
    clarification: |
      The group worked through the favour mechanic for the first time, treating it as a debt or gratitude between characters: a character who favours another feels inclined to act in their interest to pay off a perceived obligation.
      Used when Garland favoured Sergeant Iyer to gain advantage compelling him. The GM noted he had not used this system before and wanted to revisit it.

  - topic: "Conditions, crumble, and Paxton's resurrection"
    clarification: |
      Conditions impose disadvantage on moves with that stat, grant an experience point when used, and clear on settling in; armor ticks off in place of a condition.
      When all stats are conditioned a character crumbles and chooses an outcome, normally including death — but Paxton's crumble lets him return from death (changed, and reflexively soiling himself each time) rather than die permanently. This was Paxton's player's first time with the system.

