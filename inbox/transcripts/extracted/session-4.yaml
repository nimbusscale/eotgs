      His herald curse visibly cracked foundations and structures throughout the tunnels the party traversed.
  - entity: "Garland yn Greenholt"
    category: "pc"
    new_info: |
      Followed Captain Dorn through the tunnels to reach the church dungeon beneath the Chryseum.
