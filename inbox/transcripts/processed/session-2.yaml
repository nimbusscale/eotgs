      The party's arrival, carrying ruin's influence, had destabilized everything.
    entities_involved: ["Garland yn Greenholt", "Castor"]
    location: "The Nodrum"
  - description: |
      Garland refused to let Castor be re-cursed and instead used his Grasping Gate spell to teleport and retrieve the Seal of Unmaking's case.
      During the transit, the chaotic magical energies stripped away his recent memory of Mira — his great-great-grandchild.
      He returned holding the case but felt a hollow absence he could not explain, his earlier optimism drained.
    entities_involved: ["Garland yn Greenholt", "Mira"]
    location: "The Nodrum"
  - description: |
      The party helped the Triune redirect ley line energy into the Whiteglass seal, pushing the Xan-Kor back to a faint outline.
      Roderic held a mirror, Edric a lens, and Castor opened the case at the critical moment.
      The ritual succeeded but the ley lines passing through Edric and Roderic emerged corrupted by ruin.
      Reality shifted — a pivotal historical victory by Lucifer's champion was retroactively undone, and the Bonewall's protective wards began to crumble.
    entities_involved: ["Garland yn Greenholt", "Edric Bloom", "Sir Roderic Lightbearer", "Castor"]
    location: "The Nodrum"
  - description: |
      Garland admonished the Triune for wielding power not meant for mortal hands.
      The Triune conceded and agreed to repair the Seal of Unmaking's broken case and study whether the empowered Whiteglass seal could reseal the God of Ruin.
    entities_involved: ["Garland yn Greenholt"]
    location: "The Nodrum"
  - description: |
      During the night at the Nodrum, ruin manifested personally for each party member.
      Roderic's door lock crumbled in his hands.
      Garland's books became indecipherable, as though the knowledge itself was erased.
      Edric's dreams were drained of inspiration, replaced by mundane visions.
      Castor's mere presence caused the clockwork servants to break down.
    entities_involved: ["Sir Roderic Lightbearer", "Garland yn Greenholt", "Edric Bloom", "Castor"]
    location: "The Nodrum"
