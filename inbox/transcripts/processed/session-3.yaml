gm_observations:
  - "The GM explicitly named each PC's herald curse domain: Roderic = failing wards (protection fails), Edric = souring tales (communication/reputation decays), Garland = forgetting (knowledge lost), Castor = crumbling foundations (physical structures decay). These are ruin-counterparts of each character's core identity."
  - "The Xan-Kor's reality-shifting during the Nodrum ritual erased an unnamed hero from the tale of the Xan-Kor's original defeat. The GM noted this has had repercussions in the world the party hasn't seen yet — a planted plot hook."
  - "Aurelion has a stray dog problem with active dog catchers — set up as a complication for Castor in dog form."
  - "Aurelion is hostile to bards and storytellers, adding pressure on Edric beyond the wanted posters."
  - "Castor's vow of celibacy and the exotic beaver pheromone create strong dramatic tension — the scent may be a lure or trap specifically targeting a beaver, deeply suspicious given how rare beavers are underground."
  - "Second Harvest's original name was Halcyrax, the Gilded Ruin — its dread-glow where gold once lay."
  - "The mine tunnels contain multiple factions and threats — rock rats, undead, guarded passages — suggesting a layered environment with different zones of control."
  - "Castor's broken vow of celibacy could become a recurring character beat, especially if offspring inherit his druidic curse. The GM confirmed this is 'certainly a possibility now.'"
  - "Dorn is aware of a potential threat to the city and has tightened security — this could complicate the party's efforts to reach the shrine beneath the Chryseum."
  - "The party's route through the mines was player-driven and unplanned by the GM, who admitted not expecting them to go through the mines."
  - "Players found the system more intuitive by session 3; the GM felt more comfortable running it."
