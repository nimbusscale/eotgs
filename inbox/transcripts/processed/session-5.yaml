gm_observations:
  - "The GM explicitly noted that Castor has been underserved in recent sessions — being stuck in mouse/beaver form makes it difficult for meaningful story moments. The shrine communion was designed to give Castor a significant character beat."
  - "The GM is treating sessions 1-5 as prologue, with the 'real game' starting from next session onward."
  - "The Dark Harlequin's claim about the beaver curse connects Castor's backstory directly to the God of Trickery — this should be tracked as unconfirmed since it comes from a potentially unreliable source."
  - "Count Marrow's vault contains significantly less gold than in Garland's era, which could indicate economic decline or resources spent on secret renewal worship."
  - "The murdered Order of the First Dawn paladin beneath the Chryseum represents an escalation by the Harlequins from trickery to lethal violence."
  - "Ken (Edric's player) may bring a different character for future sessions, and Ramsey (Roderic's player) is considering switching characters as well."

