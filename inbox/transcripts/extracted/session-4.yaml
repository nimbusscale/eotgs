      His drive is "Step forward where others hesitate."
  - entity: "Edric Bloom"
    category: "pc"
    new_info: |
      Disappeared while under Garland's invisibility spell during the approach through the tunnels beneath the Chryseum.
      The party called for him and Garland tried to drop the spell, but Edric could not be found.
      His knowledge of the tunnel network only extended as far as the Aureate cell block.
      His absence left the party without a guide for deeper exploration and without their face for negotiations.
  - entity: "Luminary Severin Morrow"
    category: "npc"
    new_info: |
      Ordered the imprisonment of bards, performers, and suspected Harlequin followers in the church dungeon beneath the Chryseum.
      Appeared in person at the Chryseum wearing the Whiteglass pendant of a Luminary.
      Claimed the Morrow family have been worshippers of renewal since Beaconhold's founding, and that he, his father, and Dawnwarden Brenn may be the heralds of renewal.
      Stated that his father has searched his entire life for a way to release ruin so that renewal could return.
      Acknowledged the Laughing One has manipulated events to pit the heralds of ruin and renewal against each other.
      Believes ruin is not acting within its nature — behaving like a wounded animal rather than a natural force.
      Demonstrated the ability to open the hidden entrance to the Shrine of Renewal beneath the Chryseum, his hands glowing green as he activated the mechanism.
      Identified Count Marrow as the missing herald needed to complete the connection and unlock the cocoon of renewal.
      The Inquisition's Corona Vigil and Order of the Eclipse Sword are preparing to arrest him and his father.
  - entity: "Count Albrecht Marrow"
    category: "npc"
    new_info: |
      According to Severin, Count Marrow has been searching his entire life to release ruin so that renewal could return, continuing a family tradition stretching back generations.
      The Morrow family have been secret worshippers of renewal since Beaconhold's founding.
      Identified by Severin as a herald of renewal — the missing piece needed to complete the puzzle and unlock the cocoon beneath the Chryseum.
      The Eclipse Sword has arrived at Crest Aurelion to arrest him.
  - entity: "Captain Eisen Dorn"
    category: "npc"
    new_info: |
      Observed by Garland and Castor moving through the tunnels beneath Aurelion; they shadowed him at a distance as he led them toward the dungeon area beneath the Chryseum.
  - entity: "The Chryseum"
    category: "location"
    new_info: |
      Contains a church dungeon below it — a sunken courtyard lined with cells on three sides, accessed via a mezzanine walkway and stairs.
      The dungeon connects to the tunnel network beneath Aurelion through multiple doors.
      Currently holds numerous bards, performers, and suspected Harlequin followers imprisoned under Luminary Severin's orders.
      A member of the Corona Vigil was observed watching the Chryseum from a building across the way.
      The interior features a massive Whiteglass stained-glass window that radiates clean light, rows of pews, soaring vaults of white gold and candlelight, and a mysterious swirling pattern on the nave floor.
      The church was built over an older, pre-Luciferian temple dedicated to the God of Renewal — a testament to Lucifer's dominion over nature.
      A hidden spiral staircase beneath the swirling floor pattern leads down to the ancient Shrine of Renewal.
      The entrance is activated by placing hands on the floor with renewal-aligned power, producing a greenish glow.
      The Order of the First Dawn serves as the Chryseum's paladinic order.
      The cathedral doors began to give way under assault from outside forces including the Corona Vigil and possibly Harlequin-bolstered crowds.
  - entity: "Aurelion"
    category: "location"
    new_info: |
      Chaos is audible in the streets above the tunnels beneath the Chryseum.
      Ruinous crowds have been appearing across the city since the party's arrival.
      The Order of the Eclipse Sword has made camp outside the city walls.
  - entity: "Aurelion Tunnels"
    category: "location"
    new_info: |
      The tunnels showed visible signs of ruin's effects after the heralds passed through — cracked foundations from Castor's curse, deteriorated locks and ward cells from Roderic's curse, and faded inscriptions from Garland's curse.
      When all five heralds of ruin and renewal traveled together, the decay found a fragile balance — cracks partially sealed and moss grew in them, though nothing was fully renewed.
      The tunnels connect to an exit near Crest Aurelion.
  - entity: "Beaconhold"
    category: "location"
    new_info: |
      Roderic sent a priest to deliver a message to the main Luciferian church at Beaconhold, requesting reinforcements to combat the spreading corruption of ruin in Marrow County.
  - entity: "The Harlequins"
    category: "faction"
    parent_file: "factions/old-gods.md"
    sub_section: "The Harlequins"
    new_info: |
      Multiple Harlequin followers have been arrested and imprisoned in the church dungeon beneath the Chryseum.
      At least one prisoner — a performer with a painted red nose and white face paint in patchwork reds, oranges, and purples — was identified as a confirmed follower of the Laughing One.
      Every prisoner in the Aureate holding cells turned out to be a follower of the Laughing One.
      When freed, the lead performer did a backflip and dance before beginning to unlock other cells, announcing "My fellow Harlequins!" to cheers from the entire block.
      Their celebration resonated with a massive crowd forming in the streets above, suggesting a broader Harlequin presence or uprising in Aurelion.
      They complied with Roderic's divine decree, returning to their cells with comical dejection.
      At least one Harlequin picked his cell lock and escaped during the commotion, wearing bells on his feet.
      Both Brenn and Severin independently identified the Laughing One as having manipulated events to pit the heralds of ruin against the heralds of renewal.
      The imprisoned Harlequins remained in their cells even as Roderic's curse weakened the locks and wards, still obeying his earlier command.
  - entity: "The Aureate"
    category: "faction"
    new_info: |
      Six Aureate guards were stationed in the holding cells beneath the Chryseum, serving as jailers on Luminary Severin's orders.
      They follow the Light but obey Severin's authority over Roderic's Luciferian decrees.
      When the party overpowered them, the surviving guards fled rather than continue fighting.
  - entity: "The God of Ruin"
    category: "faction"
    parent_file: "factions/old-gods.md"
    sub_section: "The God of Ruin"
    new_info: |
      According to both Dawnwarden Brenn and Luminary Severin, ruin is not behaving as it should — acting like a wounded animal rather than a cunning natural force.
      Something has corrupted its release, and they suspect the Laughing One's interference.
      Brenn stated that Lucifer locked ruin away long ago, which started a chain reaction that caused renewal to go dormant, leading to centuries of stagnation and civilizational decline.
  - entity: "The God of Renewal"
    category: "faction"
    parent_file: "factions/old-gods.md"
    sub_section: "The God of Renewal"
    new_info: |
      The God of Renewal sleeps within a translucent cocoon in an ancient shrine beneath the Chryseum in Aurelion.
      The cocoon inspires an instinctive, parental urge to protect it in all who behold it.
      The sleeping form within is never clearly resolved — just a curve, a shadow suggesting dormant but living presence.
      Renewal cannot be active without ruin — when Lucifer locked ruin away, renewal went dormant.
      The Morrow family has maintained worship of renewal for generations, believing the world has been slowly dying from stagnation without it.
      Signs of renewal's proximity manifested in the Chryseum: moss growing through cracks of ruin, and torches reigniting with soft white light after being dimmed.
      Unlocking the cocoon requires the presence of multiple heralds who feel an interlocking connection like puzzle pieces.
      Residual renewal energy can partially counteract the effects of ruin.
  - entity: "The Light"
    category: "faction"
    new_info: |
      The Church of Lucifer has an inquisitorial branch called the Corona Vigil, which investigates heresy.
      The Corona Vigil's military arm is the Order of the Eclipse Sword.
      The Inquisition has been investigating the Morrow family's heterodox beliefs about ruin and renewal and is preparing to arrest Luminary Severin and Count Marrow.
      There is theological division within the faith: orthodox Luciferians believe ruin should remain suppressed, while the Morrows and the Order of the First Dawn believe ruin and renewal must coexist as natural forces.
  - entity: "Second Harvest"
    category: "item"
    new_info: |
      Garland used Second Harvest to shatter an Aureate guard's sword in a single blow beneath the Chryseum, and later used its pommel to knock another guard unconscious.
  - entity: "Witch Stones"
    category: "item"
    new_info: |
      Garland originally learned spellcraft by deciphering carvings on the Witch Stones and listening to them speak through the sounds of grinding earth over centuries.
      He recorded this knowledge in his spellbook before losing it during the events at the Nodrum.
      The Shrine of Renewal evoked the same ancient resonance Garland felt at the Witch Stones.

questions_raised:
  - "What is the Corona Vigil doing at the Chryseum, and why is a member observing the building?"
  - "Will the Luciferian priest successfully deliver Roderic's message to Beaconhold?"
  - "How many Harlequins have infiltrated Aurelion, and what is their purpose in the city?"
  - "Where has Edric disappeared to while invisible in the tunnels beneath the Chryseum?"
  - "What is causing the large crowd commotion in the streets of Aurelion?"
  - "Are the Harlequins staging some kind of uprising or event in Aurelion?"
  - "Are the Morrows truly the heralds of renewal, or are they self-appointed?"
  - "Will the Order of the Eclipse Sword breach the city before the party can awaken renewal?"
  - "Why is ruin acting like a wounded animal rather than a natural force — what did the Laughing One do?"
  - "Was Count Marrow's original hiring of the party to retrieve the Seal of Unmaking part of a deliberate plan to release ruin and thereby awaken renewal?"
  - "How will Roderic reconcile his Luciferian faith with the revelation that Lucifer's suppression of ruin may have caused centuries of stagnation?"
  - "Can the five heralds retrieve Count Marrow from the Eclipse Sword without violence against the Light's own forces?"
  - "Will the fragile balancing effect observed when heralds of ruin and renewal travel together be enough to stabilize the region?"

questions_resolved:
  - question: "What lies in the shrine to the God of Renewal beneath the Chryseum in Aurelion?"
    answer: |
      An ancient, pre-Luciferian organic chamber containing a translucent cocoon with the dormant God of Renewal sleeping inside.
      The cocoon requires multiple heralds — at least five — to unlock.
    session_established: 4
  - question: "Does Marrow's son in the church hierarchy mean the church in Marrow County cannot be trusted?"
    answer: |
      Luminary Severin Morrow shares his father's belief in renewal and has been secretly maintaining worship of the old god.
      He appears to be an ally rather than an enemy, though the Church's Inquisition considers him a heretic.
    session_established: 4
  - question: "How can the curse be stopped? Can restoring the God of Renewal be the true solution?"
    answer: |
      Partial answer — ruin is acting like a wounded animal, not within its true nature.
      The God of Renewal sleeps in a cocoon beneath the Chryseum and can potentially be awakened by the heralds, which would restore balance.
      Residual renewal energy already partially counteracts ruin's effects.
    session_established: 4

arc_progress:
  - arc_name: "Curse of Ruin"
    arc_type: "group"
    development: |
      The party located each other beneath the Chryseum — Garland and Castor found Roderic imprisoned in the church dungeon.
      They freed Roderic, secured the area, and began searching for the shrine to the God of Renewal.
      Roderic sent word to Beaconhold about the old gods' return and Marrow's corruption.
      Dawnwarden Brenn revealed that Lucifer's suppression of ruin caused renewal to go dormant, leading to centuries of stagnation.
      Luminary Severin claimed the Morrow family are the heralds of renewal and opened the hidden staircase to the Shrine of Renewal.
      The party discovered the dormant God of Renewal sleeping in a cocoon beneath the Chryseum.
      They confirmed that heralds feel an interlocking connection and need Count Marrow to complete the balance.
      When heralds of ruin and renewal travel together, decay partially stabilizes — cracks seal, moss grows.
      The plan to retrieve Marrow hit an immediate obstacle: the Eclipse Sword has arrived at Crest Aurelion to arrest him.
  - arc_name: "Sir Roderic Lightbearer - Redemption"
    arc_type: "character"
    development: |
      Roderic demonstrated his commitment to protecting life by refusing to seriously harm the Aureate guards even when outnumbered four to one.
      His divine decree successfully commanded the Harlequin prisoners, showing his faith remains potent against mortal forces.
      He proactively sent intelligence about the old gods and Marrow's corruption to Beaconhold.
      He faced a theological challenge when Brenn called Lucifer's suppression of ruin hubris, but reframed it: Lucifer's light guided him here, and restoring renewal is part of divine wisdom.
      He attempted to scrutinize the Order for moral wrongdoing but could not, confirming their sincerity.
      Now he faces his most direct crisis — the Eclipse Sword, a military order of his own faith, stands between the party and the man they need to awaken renewal.
  - arc_name: "Garland yn Greenholt - Uncover the Truth"
    arc_type: "character"
    development: |
      Garland felt the Shrine of Renewal's energy partially counteract the forgetting curse on his spellbook, offering the first tangible hope that his lost knowledge could be recovered.
      He confirmed that his spellcraft originated from the Witch Stones — deciphering their carvings and listening to their ancient voices — knowledge that was erased at the Nodrum.
      He challenged Severin's claims directly, demanding proof rather than faith.

notable_quotes:
  - speaker: "Sir Roderic Lightbearer"
    line: "The ancient god of ruin has come back to the land, along with the other old gods. The seals that are binding all these ancient gods are coming apart. We are seeking out the God of Renewal, to hopefully nullify the God of Ruin and bring things back to harmony."
    context: "Roderic explaining the situation to a Luciferian priest before his capture, asking the priest to send word to Beaconhold."
  - speaker: "Sir Roderic Lightbearer"
    line: "I have been through several battles for our Lord and savior. If you honor yourself and your lives in his service, I suggest that you surrender and repent."
    context: "Roderic confronting the dungeon guards unarmed after escaping his cell."
  - speaker: "Garland yn Greenholt"
    line: "Son, this is not your day."
    context: "Garland confronting an Aureate guard who drew his sword in the cell block beneath the Chryseum."
  - speaker: "Castor"
    line: "What the fuck, dude? I'm trying to get you out of a jail!"
    context: "Castor's reaction after Roderic's divine decree ordered all the Harlequin prisoners back into their cells, undoing Castor's effort to free them."
  - speaker: "Garland yn Greenholt"
    line: "The Greenholt bloodline is strong. I populated that whole hill on my own by accident."
    context: "Garland joking about Castor's concern about his liaison with Tufa."
  - speaker: "Dawnwarden Brenn"
    line: "Don't you see? Destroying ruin is why we're in this mess."
    context: "Reacting when Roderic said he wanted to destroy ruin, revealing her belief that suppressing ruin was the original mistake."
  - speaker: "Dawnwarden Brenn"
    line: "The hubris of Lucifer brought this upon us. You cannot lock away forces of nature and expect the world to continue to operate the way that it should."
    context: "Explaining her heterodox belief that Lucifer's suppression of ruin caused the world's stagnation."
  - speaker: "Luminary Severin Morrow"
    line: "I believe that we are actually allies. The Laughing One has pit us against each other."
    context: "Severin appealing to the party after revealing himself."
  - speaker: "Garland yn Greenholt"
    line: "Prove it. If you're a herald of renewal, you'll have brought renewal in your wake. What have you renewed?"
    context: "Garland challenging Severin's claim to be a herald of renewal."
  - speaker: "Luminary Severin Morrow"
    line: "I do not offer proof, only faith."
    context: "Severin's response to Garland's demand for evidence."
  - speaker: "Sir Roderic Lightbearer"
    line: "I believe Lucifer's light shall guide us all, and he's guided me here already."
    context: "Roderic resolving his crisis of faith by interpreting his journey as divinely guided."
  - speaker: "Luminary Severin Morrow"
    line: "This was built as a testament to Lucifer's might over nature. And while Lucifer is mighty, nature and the light should exist together."
    context: "Severin explaining why the Chryseum was built over the older temple of Renewal."
  - speaker: "Garland yn Greenholt"
    line: "The land hungers, the land bides, and when men fall, the land takes them inside."
    context: "Garland's old traveling song, sung as he descended into the Shrine of Renewal ahead of everyone else."
  - speaker: "Luminary Severin Morrow"
    line: "Ruin is acting upon the world as a wounded animal might — not as a cunning wolf or a house cat. It is not acting within its nature."
    context: "Severin clarifying that ruin is behaving abnormally."
  - speaker: "Luminary Severin Morrow"
    line: "I am aware that neither of us has any reason to believe the other, but I think we can all feel the connection here. There is an imbalance — three of you and two of us. Without that balance, this world cannot be healed."
    context: "Severin acknowledging mutual distrust while arguing for the need to retrieve Count Marrow."

