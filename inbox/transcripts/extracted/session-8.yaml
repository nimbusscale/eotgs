recap_teaser: |
  The forgetting did not begin with Sariel.
  Beneath the Bonewall, in the singing dark of Muistola, the heralds learned the name the Light has lost — Vaalo, who raised the wall's lights with a coal of the buried sun — and felt the cold thing on the far side reaching its tendrils up through the stone toward them.

summary: |
  In the great hall of Muistola, the celebration of the Slate's first child in an age gave way to the rite of the memory stones.
  An old loremaster named Holvi led the heralds into the Hall of Deep Memory, where each laid a hand on the standing stones and was imbued with the Slate's tongue — and with glimpses of older memories besides.
  Paxton saw the deep dwarf Vaalo, a gray-skinned worshipper of a light below who had befriended Lucifer, helped raise the Imperium, and faded from every scripture until the Light remembered him only as a nameless builder.
  Roderic relived the grief of paladins sealing the emanation of ruin, and sensed a forgotten figure as vital as Lucifer whose name the world would no longer surrender.
  Garland looked into his own blood and saw an ancient civilization in the Vale that had learned stonecutting from the Bonewall shale, given a child to the standing stones to become their first speaker, raised towering cities, and at its height been betrayed by one of his own line who opened the gates to invaders.
  Castor reached into recent history and found a millennium of monotony and one Slate, Aamu, who carried a grief unlike the rest.
  From Holvi and old Lohka the party learned that the towers' lights are the children of Hiillos — the Spinewright's lantern, a banked coal of the buried sun — and that the Slate believe Hiillos lies in Vaalo's cradle Kehto, the same tomb Roderic alone survived when his company was slaughtered seeking that very lantern.

  Garland and Mira sought out the stone-scribe Kallio, who tends the Slate's reverent annotations on the Bonewall witch-ring and had charted the stones as a network of nexus lines running out to the world — the Ashen Vale, the Cragmarr, Beaconhold, the Nodrum — with one node lately gone silent.
  Mira's deepening connection pulled them into a blue spirit realm of standing stones, which proved to be the realm of the forgotten, where erased things drift and the Xan-Kor stirred at the distant Nodrum.
  There Garland recognized a fragment of Mira wandering loose: a memory of her that ruin had stripped from him at the Nodrum.
  To wrench them all back to the waking world swiftly, he had to leave a piece of himself behind, and he gave up the memory of his first son, Dafydd, dead these hundreds of years — choosing the living child over the smiling boy who reached for him, and forgetting Dafydd had ever existed.
  He woke at the stones hearing them now as clearly as Mira does, while Mira raged that his hesitation had let one of the network's voices fall dark.

  Above, the celebration curdled into schism.
  Moldrex, the darkness beyond the wall, had whispered to Lohka, to some of the elders, and to others a promise: surrender the child Itu, and be freed forever from the Slate's cycle of emergence and petrifaction, to make and keep children of their own like the mortals above.
  Aamu, who presides over the Slate's births and is sick with a private grief, reached for that promise; old Routa, who had raised Itu, fought to keep the child.
  As warriors closed a ring around Itu and the factions came to blows, the Dark Harlequin breathed in Castor's ear that he could only ever watch, never act — and Castor answered by leaping into a gorilla's shape, snatching the child, and putting his back to the wall.
  Garland fought to his nephew's side and Mira raised a sanctuary none could enter uninvited, while below, Roderic and Paxton pleaded with Lohka and the wavering guards.
  Roderic's blade lit with Lucifer's light and bit into Lohka's stony hide to reveal soft, perishable flesh beneath — the devolution of a Slate trading stone for Moldrex's gift — and Lohka snapped the sword in two like a twig.

  Paxton's radiance seared the boulder's exposed flesh, the first pain Lohka had ever known, and Roderic's divine decree turned the guards aside; Paxton wrung a wrestled soldier's surrender with a promise to spare Lohka's life.
  But Lohka would not yield: "There will be no agreement — Moldrex will keep me from petrifying," he swore, and fled up the stairs toward the standoff at Mira's sanctuary.
  Outside, cat-sized spiders swarmed the sealed upper entrance in their dozens, and the chittering drew closer through the dark.
  Then the ceiling of Muistola began to crack, and pale tendrils pressed down through the stone — the rot of Öuth Krelt breaching the Remembrance at last.

