session_number: 5
date_played: "2026-03-14"
source_transcript: "inbox/transcripts/prepared/session-5.txt"

recap_teaser: |
  The cocoon has opened, and the God of Renewal stirs beneath the Chryseum.
  But one herald is still missing — and the forces above have only begun to close in.

summary: |
  The party split at the Shrine of Renewal beneath the Chryseum.
  Castor remained behind to commune with the dormant God of Renewal, feeling an overwhelming sense of homecoming as the presence within the cocoon recognized him and embraced him with warmth, flooding his mind with half-forgotten memories of his grandmother telling stories of the old gods.
  Garland, Roderic, Severin, and Brenn departed through the tunnels toward Crest Aurelion to retrieve Count Marrow — the sixth and final herald needed to complete the balance.

  At Crest Aurelion, the Order of the Eclipsed Sword had breached the castle, and First Aureate Dorn was leading the Aureate in a desperate defense.
  Severin and Brenn stayed in the tunnels to avoid arrest, while Garland and Roderic navigated the besieged castle alone.
  Garland drew on centuries-old memories of Beaconhold's conquest of Aurelion to guide them through a secret passage connecting the castle vault to the count's private chambers.
  They bluffed past Aureate guards with Severin's whiteglass pendant, reached Count Marrow, and convinced the reluctant count to accompany them — arguing that ruin and renewal must be balanced by gathering all heralds together.

  Meanwhile, the Dark Harlequin appeared in the Shrine and confronted Castor directly, claiming the Laughing One was responsible for his original beaver curse and attempting to recruit him.
  When Castor touched the cocoon despite the Harlequin's warning, he received a vision from Renewal showing him as a protector — a crucial piece of the balance.
  The Dark Harlequin attacked, but Castor shifted into a wolverine and drove it off.

  The escape through the vault turned violent when Order soldiers descended on the party.
  Roderic bowled the lead soldiers down a ramp while Garland cut through another with Second Harvest, and Marrow sealed the vault door behind them.
  A Corona Vigil inquisitor branded them heretics, but the party pressed on and reunited with Severin and Brenn in the tunnels.

  Returning to the Chryseum, they found it overrun — Harlequins dancing with religious artifacts, grieving people destroying property, and a murdered Order of the First Dawn paladin lying stripped on the steps.
  Roderic's divine decree scattered the mob, but the Harlequins remained, with the Dark Harlequin puppeteering the dead paladin's corpse in a grotesque display.
  The Dark Harlequin locked eyes with Roderic and projected a disturbing vision that seeded doubt about Severin and Marrow's true intentions.
  Roderic charged through the lesser Harlequins and beheaded the Dark Harlequin in a single devastating strike, while Garland and Brenn eliminated the rest.

  The party descended to the Shrine of Renewal where Castor waited in beaver form behind a barricade he had built.
  With all six heralds gathered around the cocoon, the ruinous energy flowed out of the heralds of ruin, merged with the renewal energy, and the cocoon opened — releasing a spring-like surge that transformed the desiccated chamber into a verdant, living space.
  Roderic used Eyes of the Faithful to confirm that Severin and the followers of renewal were sincere, dispelling the doubt the Dark Harlequin had planted.

major_events:
  - description: |
      Castor remained at the Shrine of Renewal while the rest of the party departed to retrieve Count Marrow.
      Standing before the translucent cocoon, he felt an overwhelming wave of nostalgia — a sense of homecoming he had not experienced in centuries.
      The presence within the cocoon recognized him as a herald of ruin, the missing counterpart to its balance, and embraced him with warmth, flooding his mind with half-forgotten memories of his grandmother stirring a stew pot and telling stories of the old gods as partners of mortals.
      He shifted from mouse form back to human to commune more deeply and convinced the others he needed to stay.
    entities_involved: ["Castor", "Garland yn Greenholt"]
    location: "Shrine of Renewal"
  - description: |
      Garland, Roderic, Severin, and Brenn emerged from the tunnels near Crest Aurelion to hear the sounds of battle — the Order of the Eclipsed Sword had breached the castle.
      Dawnwarden Brenn and Severin stayed behind in the tunnels, knowing the Order would arrest them on sight, while Garland and Roderic pressed on alone to retrieve Count Marrow.
    entities_involved: ["Garland yn Greenholt", "Sir Roderic Lightbearer", "Luminary Severin Morrow", "Dawnwarden Brenn", "Captain Eisen Dorn"]
    location: "Crest Aurelion"
  - description: |
      In the courtyard, Garland and Roderic spotted First Aureate Dorn and his guards fighting a dozen Order of the Eclipsed Sword soldiers.
      They chose to bypass the battle rather than intervene, prioritizing the mission to reach Count Marrow.
    entities_involved: ["Garland yn Greenholt", "Sir Roderic Lightbearer", "Captain Eisen Dorn"]
    location: "Crest Aurelion"
  - description: |
      Roderic presented Severin's whiteglass pendant to a veteran Aureate guard and convinced him they had been sent to retrieve the Count.
      When the guards refused vault access, Garland used his veteran's authority and thinly veiled threats to compel them to stand aside.
      The guards relented, letting them into the vault before turning to fight the approaching Order soldiers.
    entities_involved: ["Sir Roderic Lightbearer", "Garland yn Greenholt"]
    location: "Aurelion Vault"
  - description: |
      Inside the vault, Garland saw immense piles of gold — though notably less than when he had been there centuries ago.
      He led Roderic through the secret passage from the vault up to Count Marrow's private chambers, where they found the Count.
      Marrow was reluctant, accusing them of bringing ruin to Aurelion, but Roderic explained that ruin and renewal must be balanced by gathering all six heralds.
      Marrow relented, acknowledging he had little choice between accompanying them or being arrested by the Order.
    entities_involved: ["Garland yn Greenholt", "Sir Roderic Lightbearer", "Count Albrecht Marrow"]
    location: "Crest Aurelion"
  - description: |
      The Dark Harlequin appeared in the Shrine of Renewal and confronted Castor directly.
      It warned him not to touch the cocoon, claimed the Laughing One was responsible for Castor's original beaver curse — calling it the god's greatest joke — and tried to recruit Castor to travel the world together in a partnership of building and laughter.
    entities_involved: ["Castor", "The Dark Harlequin"]
    location: "Shrine of Renewal"
  - description: |
      Castor touched the cocoon despite the Dark Harlequin's warning and received a vision from Renewal.
      He saw himself standing before a crowd of Harlequin followers and ruined, distraught people trying to breach the Chryseum, and in the vision he calmed and redirected the crowd — imbued with the sense that he was a crucial protector of the dormant god.
      When he emerged from the vision, the Dark Harlequin lunged at him.
      Castor shifted into a wolverine and fought back, clawing the creature and drawing its ichor-like blood before it retreated up the stairs.
    entities_involved: ["Castor", "The Dark Harlequin", "The God of Renewal"]
    location: "Shrine of Renewal"
  - description: |
      In the Aurelion Vault, Order of the Eclipsed Sword soldiers descended on the party during their escape.
      Roderic shield-kicked the lead soldier down the ramp, bowling over his companions, while Garland struck another with Second Harvest, its armor-ignoring blade cutting clean through the man's breastplate.
      A Corona Vigil inquisitor branded them heretics, but Count Marrow sealed the vault door behind them from inside, and the party escaped into the tunnels.
    entities_involved: ["Sir Roderic Lightbearer", "Garland yn Greenholt", "Count Albrecht Marrow"]
    location: "Aurelion Vault"
  - description: |
      The party reunited with Severin and Brenn in the tunnels beneath Crest Aurelion.
      Severin and Count Marrow shared a warm embrace, and Severin confirmed they were close to restoring renewal.
    entities_involved: ["Luminary Severin Morrow", "Count Albrecht Marrow", "Dawnwarden Brenn"]
    location: "Aurelion Tunnels"
  - description: |
      Castor, alone at the Shrine of Renewal, shifted to beaver form and fortified the hidden entrance by building a dam-like barricade from desiccated branches and loose stone.
      While working, he overheard Harlequins interrogating and ultimately killing an Order of the First Dawn paladin above him, the paladin's cries growing weaker until they fell silent.
    entities_involved: ["Castor", "The Harlequins"]
    location: "Shrine of Renewal"
  - description: |
      Returning to the Chryseum, the party found the temple in chaos — Harlequins dancing with religious artifacts, grieving and ruined people destroying property, and a murdered paladin lying stripped on the steps leading down to the Shrine.
      Roderic issued a divine decree commanding everyone to leave or face his sword, and the mob obeyed, filing out of the temple.
      The Harlequins who remained revealed the Dark Harlequin puppeteering the dead paladin's corpse with dark magic, making it dance and speak mockingly.
    entities_involved: ["Sir Roderic Lightbearer", "The Harlequins"]
    location: "The Chryseum"
  - description: |
      The Dark Harlequin locked eyes with Roderic and projected a disturbing vision — the Chryseum's architecture appeared to contain dark motifs, seeding doubt about whether Severin and Marrow were truly trustworthy.
      Roderic shook off the worst of it but could not entirely dismiss the seeds of doubt.
      He charged through the lesser Harlequins, absorbing their blows against his armor, and drove his sword through the illusory paladin shield and the Dark Harlequin in a single devastating strike, severing its head.
      Garland and Dawnwarden Brenn eliminated the remaining Harlequins.
    entities_involved: ["Sir Roderic Lightbearer", "Garland yn Greenholt", "Dawnwarden Brenn", "The Dark Harlequin"]
    location: "The Chryseum"
  - description: |
      With the Chryseum cleared, the party descended to the Shrine of Renewal where Castor waited in beaver form behind his barricade.
      All six heralds gathered around the cocoon — three of ruin and three of renewal.
      The ruinous energy each herald of ruin carried flowed out of them and combined with the renewal energy around the cocoon.
      The cocoon opened and a spring-like surge of renewal washed through the chamber, transforming the desiccated ruin into a verdant, living space.
    entities_involved: ["Sir Roderic Lightbearer", "Garland yn Greenholt", "Castor", "Luminary Severin Morrow", "Dawnwarden Brenn", "Count Albrecht Marrow", "The God of Renewal"]
    location: "Shrine of Renewal"
  - description: |
      Roderic used Eyes of the Faithful to assess whether Severin and the followers of renewal were being honest about their intentions.
      The reading confirmed they were sincere — renewal and ruin are both part of the natural order, and without reuniting them the world will continue to stagnate while ruin acts destructively.
      The doubt the Dark Harlequin had planted was alleviated.
    entities_involved: ["Sir Roderic Lightbearer", "Luminary Severin Morrow"]
    location: "Shrine of Renewal"

