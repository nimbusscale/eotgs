gm_observations:
  - "The Triune's devices malfunctioning when examining Edric is a significant plot hook, possibly setting up a reveal about Edric's unknown parentage or deeper connection to the old gods."
  - "The Triune's secret siphoning of Castor's curse energy to power the Aegis Mechanism explains their previous eagerness about Castor and creates a trust issue with Garland."
  - "The 'reality shift' mechanic is significant: ruin doesn't just decay the present, it retroactively changes the past. The party's very presence near powerful magical sites is dangerous."
  - "Garland's memory loss of Mira removes his emotional anchor and motivation for protecting the Ashen Vale — other memories seem to be hollowing out as well."
  - "The God of Forgetting is a newly introduced Old God whose domain (erasure, letting go, removal of memory) is thematically distinct from Ruin but potentially complementary. The Xan-Kor as its creation sets up a complex moral dilemma."
  - "The contradiction between the party witnessing ruin in the river and the scrying showing no ruin is intentional — the GM confirmed it is 'part of the story,' not an oversight."
  - "The Triune's claim that the party are heralds of ruin is presented as their best theory, not necessarily the complete truth."
  - "The Dark Harlequin appears distinct from rank-and-file Harlequins — it has the power to project visions and manifest impossibly, suggesting a hierarchy within the God of Trickery's followers."
  - "The Harlequins' confession about the Aldric livery resolves a major thread but reveals their intelligence-gathering capabilities and knowledge of the party's psychological vulnerabilities."
  - "Ruin's influence on Crownvale is accelerating: guards abandoning walls, Sergeant Iyer in despair. This represents a significant escalation from earlier signs."
  - "The party's plan to seek a temple of Renewal beneath the Chryseum is the Triune's direction, though the GM neither confirmed nor denied additional details in-game."
  - "The GM confirmed a key choice point: Castor could have been re-cursed, but the party chose to channel the energy into the Seal of Unmaking, which will have consequences."

