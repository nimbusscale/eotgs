# Maps KB entity (subdir/slug) -> images.
# Image files live in images/ (repo root, gitignored). Copied into the site
# at build time by scripts/build_site.py.
#
# Optional `hero`: rendered at the top of the page with no caption (it is
#   self-evidently the subject of the page). `alt` is for accessibility only.
# `gallery`: list rendered in a "## Gallery" section; each image shows its
#   `caption` beneath it.
# Omit `hero` to send every image to the gallery — use this for pages where
# no single image represents the whole entity (e.g. faction pages).
#
# `library`: optional list (sibling to `hero`/`gallery`) of reference-only
#   images that must NOT be published to the site — the canonical studio
#   reference plates used to drive image generation. build_site.py never
#   publishes these (see _entity_images); they exist here so the
#   illustrate-scene / illustrate-session skills can find a character's
#   identity plate and its prompt spec.
#   NOTE: a `library` item's `file:` is a REPO-ROOT-RELATIVE path
#   (e.g. config/image/library/paxton-reference-plate.jpeg), NOT a path under
#   images/ like `hero`/`gallery` use. The plates are committed dev artifacts
#   under git change-control, not server-synced content, so the map points
#   straight at them in config/. This is fine — image-map.yaml is pipeline
#   wiring and may reference non-published images.
#
# Reference-selection priority (used by the illustrate skills):
#   - PCs   -> ALWAYS the library plate (image + prompt). The hero/gallery for
#             a PC is player-submitted in-world art with no prompt of its own.
#   - NPCs  -> library plate if one exists -> else hero image -> else any other
#             image that includes the character.
#
# Per image item (in `hero`, `gallery`, or `library`):
#   file:    path to the image file (required). Under images/ for hero/gallery;
#            repo-root-relative for library (see note above).
#   caption: shown beneath gallery images
#   alt:     accessibility text for hero images
#   description: (optional) a fuller account of what is in the picture. The
#     illustrate skills read this to choose which reference best fits a moment
#     (e.g. weapon-free vs. armed, which location view to use).
#   prompt:  (optional) repo-relative path to that image's spec JSON in
#     config/image/prompts/. Links a generated image back to the prompt that
#     produced it, and lets the skill load a reference's canon sub-prompt.
#     Player-submitted PC hero/gallery art has NO prompt; library plates and
#     NPC/location images we generated DO.

pcs/castor:
  library:
    - file: config/image/library/castor-reference-plate.jpeg
      prompt: config/image/prompts/castor-reference-plate-prompt.json
      description: "Castor in human (wood-elf) form: shaggy red-orange hair to the jaw, pointed ears, lean weary build, tattered earth-toned traveler's outfit and ragged hooded cloak. Canonical identity plate."
    - file: config/image/library/castor-beaver-reference-plate.jpeg
      prompt: config/image/prompts/castor-beaver-reference-plate-prompt.json
      description: "Castor in his true beaver form: an unusually large rich chestnut-brown beaver, about knee-high to a standing person. Use when the moment shows him shapeshifted — his true form."
  hero:
    file: pcs/castor-human.jpg
    alt: "Castor in human form"
    description: "Castor in human (wood-elf) form, front-facing. Player-submitted in-world art."
  gallery:
    - file: pcs/garland-and-castor-beaver.jpg
      caption: "Garland cradling Castor in his true beaver form"

pcs/garland-yn-greenholt:
  library:
    - file: config/image/library/garland-reference-plate.jpeg
      prompt: config/image/prompts/garland-reference-plate-prompt.json
      description: "Garland yn Greenholt: extraordinarily old warrior-sage, elven pointed ears, weathered sun-lined veteran's skin. Canonical identity plate."
  hero:
    file: pcs/garland-portrait.jpg
    alt: "Garland yn Greenholt"
    description: "Garland's face and identity, portrait framing. Player-submitted in-world art."
  gallery:
    - file: pcs/garland-second-harvest.jpg
      caption: "Garland walks the vale, Second Harvest in hand"
      description: "Garland holding his signature sword Second Harvest (broad forward-curved pattern-welded blade). Player-submitted in-world art showing him armed."
    - file: pcs/garland-and-castor-beaver.jpg
      caption: "The old guardian and his beaver kin"

