new_entities:
  npcs:
    - name: "Mira"
      description: |
        Aldric Garlandsson's ten-year-old daughter, precocious and
        sharp-eyed. She recognized Garland despite his disguise, calling
        him "Pappy" and identifying him by his feet. She has a warm
        relationship with her great-grandfather and serves as an unwitting
        go-between, delivering Garland's warning letter to Aldric.
      first_location: "Crownvale"
      notes: "Personal relationship with Garland. Likely to recur as connection to Aldric's household."

    - name: "Sergeant Iyer"
      description: |
        A sergeant-at-arms in Aldric's guard, responsible for escorting
        Mira. A dutiful soldier with personal troubles — his wife has been
        unfaithful. Edric charmed him into abandoning his post briefly
        for drinks and pumped him for information about Aldric.
      first_location: "Crownvale"
      notes: "Connected to Aldric's household. Edric extracted information from him. Stationed in Crownvale where party may return."

  locations:
    - name: "Beaver Lake"
      type: "Landmark"
      description: |
        A lake in the foothills of the Cinderwall, formed by the Great
        Beaver Dam. The upper Ashen Flow feeds into it, and the lower
        Ashen Flow continues beyond the dam into the Ashen Vale. Home to
        a beaver colony that Castor knows well — his kin built and
        maintained the dam for generations. The beavers were evacuated
        downstream when the party arrived ahead of the ruin.
      notes: "Garland erected a spirit wall upstream of the lake to block the ruin. The corruption is pooling at the barrier site. An abandoned fisher's hut sits on the lakeshore."

    - name: "Crownvale"
      type: "Settlement"
      description: |
        The largest town in the Ashen Vale, seat of Aldric Garlandsson's
        ambitions. Built around the ruins of an old Imperium fort that
        Aldric has been restoring as his keep, with ramshackle buildings
        growing up around the walls. A farming community and market town
        with a bridge approach. Aldric styles himself a lord here, basing
        his authority on the Greenholt name.
      notes: |
        Aldric's keep is built on Imperium ruins. The town is the capital
        of a farming region. Garland is widely recognized here but
        prefers to avoid attention since Aldric's power relies on Garland's
        absence. Crown Vale is downstream of Beaver Lake and threatened
        by the approaching ruin.

    - name: "Farlands Pass"
      type: "Landmark"
      description: |
        A mountain pass through the Cinderwall connecting the Ashen Vale
        region to lands beyond. Used by trade caravans.

  items: []

  factions: []

entity_updates:
  - entity: "Castor"
    category: "pc"
    new_info: |
      Can communicate with beavers through gestures, body language, and
      tail-slapping — not verbal speech, but enough to convey urgency and
      general ideas. The beaver colony at Beaver Lake knows and recognizes
      him. In beaver society, holding a stick signifies authority. Castor
      is deeply connected to this colony — it is essentially his home.
      He can shapeshift into various animals (giraffe, horse, mule, etc.)
      but all his forms retain subtle beaver characteristics — a beaver
      tail on a horse, beaver feet on a giraffe. His true form is beaver.
      He has traveled extensively across the continent as a beaver,
      including to regions with savannah climates, giving him knowledge
      of exotic fauna. He was originally a human carpenter before being
      transformed into a beaver.

  - entity: "Sir Roderic Lightbearer"
    category: "pc"
    new_info: |
      Carries the authority of the Church of Lucifer as a knight errant
      on assignment — not on sabbatical, but specifically tasked with
      redemption through deeds after a crisis of faith. His battalion was
      destroyed, and he blames his insufficient faith. The failed attempt
      to heal the horses deepened this crisis. He possesses the ability to
      sense when people are contemplating sin — body language and spiritual
      perception from his years as an acolyte. He wears
      recognizable church armor and is identifiable as a paladin. His
      order is called "The Redeemers of Light". He reports to a superior in the church hierarchy.

  - entity: "Edric Bloom"
    category: "pc"
    new_info: |
      His bardic instrument is storytelling rather than music — he tells
      short tales and parables to produce his bardic effects. He carries
      the Seal of Unmaking in its warded box. He knows about Altreth, a
      city-state destroyed in a manner similar to Ashbrook — people who
      entered aged rapidly and died, and the story itself was "unmade"
      from memory. He knows that whiteglass resists ruin. He has a
      pragmatic streak regarding Count Marrow — he's willing to steal
      from Marrow's collection if it would help. He experienced a
      disturbing compulsion in Crownvale — a vision of Sergeant Iyer's
      marital troubles and an almost irresistible urge to weaponize that
      knowledge, which he recognized as ruin's influence on his mind.

  - entity: "Garland yn Greenholt"
    category: "pc"
    new_info: |
      Known as "Lord Greenholt" in the Ashen Vale. His grandson Aldric
      styles himself a lord in Crownvale, basing his authority on the
      Greenholt bloodline — but Aldric's power relies on Garland's
      absence. Garland is widely recognized throughout the region and
      must disguise himself to move unnoticed. He has a warm relationship
      with Mira, Aldric's ten-year-old daughter, who calls him "Pappy."
      He carries foreign candy (butterscotch) as treats for grandchildren.
      He suspects Aldric may be
      connected to the events at Ashbrook based on Rowan's letter and
      the livery found at Beaver Lake.

  - entity: "Aldric Garlandsson"
    category: "npc"
    new_info: |
      Has a ten-year-old daughter named Mira and at least one other
      younger child. His guards wear brigandine armor and carry spears
      topped with his livery. He is rebuilding an Imperium-era fort as
      his keep in Crownvale. His consolidation of power relies on
      Garland's absence. A scrap of his livery was found fresh at Beaver
      Lake, and Rowan's letter mentioned someone in his livery near
      Ashbrook before the disaster. However, Edric's investigation of
      Sergeant Iyer suggests Aldric is not directly involved with the
      ruin's release. His relationship with Garland is complicated —
      he would not be happy to see his grandfather in Crownvale.

  - entity: "Count Albrecht Marrow"
    category: "npc"
    new_info: |
      Sent the party to retrieve the Seal of Unmaking from Ashbrook. He
      provided a warded box and offered suspiciously generous coin while
      asking too few questions. He is known to collect whiteglass
      artifacts. His son holds a ranking position in the Church of
      Lucifer, giving the Marrow family influence over the local church
      in Marrow County. The party suspects his motives and has decided
      not to return the Seal to him. Marrow County lies between the
      Ashen Vale and Beacon Hold, meaning the party must pass through
      his territory.

  - entity: "Rowan yn Greenholt"
    category: "npc"
    new_info: |
      Rowan had been living in Ashbrook before the disaster. She wrote
      a letter to Garland mentioning strange occurrences — stonework
      that changed by night, water that tasted too sweet, fish lingering
      in the shallows — and reported seeing someone dressed in Aldric's
      livery. She is now gone, presumably killed when Ashbrook was
      destroyed. She was Garland's granddaughter (distinct from Aldric).

questions_raised:
  - "What does Count Marrow want with the Seal of Unmaking, and did he know what removing it would unleash?"
  - "Why was someone wearing Aldric's livery at Beaver Lake and near Ashbrook before the disaster?"
  - "Is the spreading influence of ruin affecting people's minds — making them accept decay and endings as natural?"
  - "Can the spirit wall hold long enough for the party to find a solution at Beacon Hold?"
  - "What happened to the Imperium that even with the Unmaker sealed and Lucifer ascendant, the empire still fell?"
  - "Is Edric's disturbing compulsion in the tavern a sign that ruin is specifically targeting the party?"
  - "Does Marrow's son in the church hierarchy mean the church in Marrow County cannot be trusted?"
  - "Can the Seal of Unmaking be used to reseal the force of ruin, and if so, how?"

questions_resolved:
  - question: "Can Castor communicate with beavers?"
    answer: |
      Not through verbal speech, but through gestures, body language,
      tail-slapping, and familiarity built over generations of living
      among them. He can convey urgency and general concepts but not
      nuanced ideas.
    session_established: 1

  - question: "What is the relationship between the old gods and the new gods?"
    answer: |
      The old gods are forces of nature — uncaring, neither good nor evil,
      but indifferent to human suffering. The new gods, led by Lucifer,
      represent civilization, order, and care for people. Lucifer drove
      the old gods into shadow to protect civilization. The Wild Hunt and
      the force of Ruin are old gods. The old traditions call the force
      of ruin "the Gentle Collapse" — a natural necessity, not a demon —
      suggesting the Luciferians may have imprisoned something that was
      never meant to be caged.
    session_established: 1

  - question: "What is the party's relationship with Count Marrow?"
    answer: |
      Marrow hired them to retrieve the Seal of Unmaking. The party has
      decided not to return it to him, suspecting his motives. They plan
      to bypass Marrow County on their way to Beacon Hold, though this
      will be difficult as it lies directly in their path.
    session_established: 1

arc_progress:
  - arc_name: "Curse of Ruin"
    arc_type: "group"
    development: |
      The party released the force of ruin by removing the Seal of
      Unmaking from Ashbrook. They raced ahead of the cursed river,
      evacuated the beaver colony, and erected a spirit wall to
      temporarily hold back the corruption. However, the ruin is pooling
      at the barrier and spreading its influence across the land — rotting
      preserved food, crumbling structures, and subtly affecting people's
      minds. The party now heads to Beacon Hold to seek help from the
      Church of Lucifer and the Wizard's College before the spirit wall
      fails.

  - arc_name: "Garland's Uncover the Truth"
    arc_type: "character"
    development: |
      Garland chose "Uncover the Truth" as his character arc, driven by
      suspicion that his grandson Aldric may be connected to the events
      at Ashbrook. Evidence: Rowan's letter mentioned someone in Aldric's
      livery near Ashbrook before the disaster, and a fresh scrap of
      Aldric's livery was found at Beaver Lake. Edric's investigation of
      Aldric's guards suggests Aldric himself is uninvolved, but the
      mystery remains — who bearing his colors was present at these
      locations?

  - arc_name: "Roderic's Redemption"
    arc_type: "character"
    development: |
      Roderic's crisis of faith deepened when his attempt to heal the
      horses was overwhelmed by ruin's proximity. He interpreted this as
      confirmation that his faith is insufficient — the same weakness he
      blames for his battalion's destruction. He is on assignment from
      the church as a knight errant, tasked with redeeming himself through
      deeds. His successful blessings in the Crownvale tavern offered a
      counterpoint — his faith can still move people, even if it cannot
      yet overcome the old gods' power.

