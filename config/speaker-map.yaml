# Transcription corrections - case-insensitive replacements
# Add new entries as you discover speech-to-text errors
transcription_corrections:
  # Character name mishearings
  - match: "Roderick"
    replace: "Roderic"
  - match: "kather"
    replace: "Castor"
  - match: "Katherine"
    replace: "Castor"
  - match: "Castro"
    replace: "Castor"
  - match: "Garlin"
    replace: "Garland"
  - match: "Edrick"
    replace: "Edric"

