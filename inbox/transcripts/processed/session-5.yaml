entity_updates:
  - entity: "Castor"
    category: "pc"
    new_info: |
      Born after the Godstorm, in the early days of the Imperium — his parents lived through Lucifer's ascension.
      As a child, his grandmother told stories of the old gods not with fear but as partners of mortals who had always been good to people.
      In his previous life before the beaver curse, Castor was a commoner who cared more about survival than the comings and goings of greater powers.
      The God of Renewal recognized Castor as a herald of ruin and embraced him with deep warmth — he felt a nostalgic connection to renewal stronger than any other herald experienced.
      The Dark Harlequin claimed the Laughing One was responsible for Castor's original beaver curse, calling it the god's greatest joke.
  - entity: "Sir Roderic Lightbearer"
    category: "pc"
    new_info: |
      Has prior experience working alongside the Order of the Eclipsed Sword — his own order, the Redeemers of Light, once supplemented Eclipsed Sword operations.
      He respects their tactical efficiency but fears their rigid adherence to orders with no room for judgment.
      Articulated a nuanced theological position: ruin and renewal are forces of nature subordinate to Lucifer, not gods — those who worship them are ignorant, but not wrong to believe these forces must exist.
      Confronted a Corona Vigil inquisitor who declared him a heretic, responding that Lucifer speaks through him directly.
  - entity: "Garland yn Greenholt"
    category: "pc"
    new_info: |
      As a young soldier, participated in Beaconhold's military campaign that conquered Crest Aurelion centuries ago, forcing the capitulation of a Morrow ancestor who ruled it.
      During that campaign, he was overwhelmed by the sheer wealth of Crest Aurelion's vault — more gold than he had ever seen, coming from the sparsely populated Ashen Vale.
      He discovered a secret passage connecting the vault to the ruler's private chambers, knowledge that proved critical centuries later.
  - entity: "Count Albrecht Marrow"
    category: "npc"
    new_info: |
      Keeps a collection of whiteglass artifacts in his private chambers.
  - entity: "Luminary Severin Morrow"
    category: "npc"
    new_info: |
      Wears a whiteglass pendant as a mark of his office as Luminary.
      Can open the hidden stairway to the Shrine of Renewal with a gesture of his hand.
  - entity: "Old Gods"
    category: "faction"
    parent_file: "factions/old-gods.md"
    sub_section: "The God of Renewal"
    new_info: |
      The cocoon opened when all six heralds of ruin and renewal gathered together — ruinous energy flowed from the heralds of ruin and combined with renewal energy, releasing a spring-like surge that transformed the desiccated Shrine into a verdant, living space.
  - entity: "Old Gods"
    category: "faction"
    parent_file: "factions/old-gods.md"
    sub_section: "The Harlequins"
    new_info: |
      The Dark Harlequin claimed the Laughing One was responsible for Castor's original beaver curse.
      It attempted to recruit Castor away from Renewal, offering a partnership of building and laughter.
      The Dark Harlequin demonstrated the ability to puppeteer a dead paladin's corpse using dark magic and to project disturbing visions through eye contact that seed doubt and reveal (or fabricate) hidden truths.
      Harlequins captured, tortured, and killed an Order of the First Dawn paladin beneath the Chryseum — an escalation from trickery to lethal violence.
  - entity: "The Light"
    category: "faction"
    parent_file: "factions/the-light.md"
    sub_section: "Order of the Eclipsed Sword"
    new_info: |
      Known for meticulous tactical planning and ruthless efficiency in execution.
      They follow orders rigidly with no room for independent judgment or leniency.
      Have previously collaborated with other Luciferian military orders, including the Redeemers of Light, on operations.
  - entity: "The Light"
    category: "faction"
    parent_file: "factions/the-light.md"
    sub_section: "Corona Vigil"
    new_info: |
      A Corona Vigil inquisitor accompanied the Order of the Eclipsed Sword into the Aurelion Vault, declaring Roderic and his companions heretics when they refused to surrender Count Marrow.
  - entity: "Aurelion"
    category: "location"
    parent_file: "locations/aurelion.md"
    sub_section: "Crest Aurelion"
    new_info: |
      Contains a massive vault with diminishing gold reserves and a secret passage connecting it to the count's private chambers, discovered during Beaconhold's conquest centuries ago.
      Beaconhold conquered Crest Aurelion by forcing the capitulation of a Morrow ancestor who ruled it.
  - entity: "Aurelion"
    category: "location"
    parent_file: "locations/aurelion.md"
    sub_section: "The Shrine of Renewal"
    new_info: |
      The chamber predates the Chryseum, the Imperium, and the Luciferian era — shaped organically rather than constructed.
      The vines and roots are petrified and desiccated but show faint signs of recovery when a herald is present — small cracks appear and then heal.
      The cocoon radiates faint warmth and contains what appears to be a figure in a fetal position within a translucent membrane.
      When all six heralds gathered, the cocoon opened and the chamber transformed from desiccated ruin to a verdant, living environment filled with renewal energy.
 
questions_raised:
  - "Was the Laughing One truly responsible for Castor's original beaver curse, or was the Dark Harlequin lying?"

questions_resolved: []

arc_progress:
  - arc_name: "Curse of Ruin"
    arc_type: "group"
    development: |
      The party successfully retrieved Count Marrow — the sixth herald — from Crest Aurelion during the Order of the Eclipsed Sword's siege.
      Castor communed with the God of Renewal and received a vision identifying him as a key protector.
      The Dark Harlequin actively tried to prevent the heralds from reuniting, confronting Castor at the Shrine and later attacking the party in the Chryseum.
      All six heralds gathered at the Shrine of Renewal and the cocoon opened, releasing the God of Renewal and transforming the chamber with spring-like energy.
      The balance between ruin and renewal has been restored in the Shrine, though the broader world remains affected.
      Edric is still missing.
  - arc_name: "Sir Roderic Lightbearer - Redemption"
    arc_type: "character"
    development: |
      Roderic articulated a nuanced theology — ruin and renewal are forces of nature subordinate to Lucifer, not gods — positioning him in tension with the Eclipsed Sword's rigid orthodoxy.
      He bypassed the Order rather than fighting them to reach Marrow, then faced a Corona Vigil inquisitor who branded him a heretic, to which he responded that Lucifer speaks through him directly.
      He defeated the Dark Harlequin in decisive combat after it planted doubt about Severin and Marrow's trustworthiness.
      Eyes of the Faithful confirmed the followers of renewal are sincere, resolving the doubt and validating his choice to trust them.

notable_quotes:
  - speaker: "Roderic"
    line: "I don't consider ruin and renewal to be gods. I think of them as forces of nature. Nature is separate from gods. Lucifer is above them, but they are something that needs to exist in the world."
    context: "Articulating his theological position on ruin and renewal"
  - speaker: "Roderic"
    line: "While some people are ignorant to think that they are gods, I don't think that they are wrong to think that they need to exist."
    context: "Acknowledging a middle ground between heresy and orthodoxy"
  - speaker: "The Dark Harlequin"
    line: "I think the best joke was letting you turn into a beaver. Why a beaver? Why not a lion? Why not a cat? A beaver? Really? You don't see the humor in that?"
    context: "Claiming the Laughing One was responsible for Castor's original curse"
  - speaker: "Castor"
    line: "I'll have you know that my life as a beaver has been studious and fulfilling, and I don't find it funny at all. I think it's quite the noble creature."
    context: "Defending his beaver existence to the Dark Harlequin"
  - speaker: "The Dark Harlequin"
    line: "And that is the punchline."
    context: "Responding to Castor's earnest defense of beaver-hood"
  - speaker: "Garland yn Greenholt"
    line: "We don't have time for explanation, son. You're going to move out of the way or you're not."
    context: "Threatening the Aureate guard blocking the vault entrance"
  - speaker: "Count Albrecht Marrow"
    line: "You brought ruin to this place and now you're trying to bring me to the temple. Why should I go with you?"
    context: "Confronting the party about their role as heralds of ruin"
  - speaker: "Roderic"
    line: "I am not speaking for Lucifer. Lucifer speaks through me."
    context: "Responding to the Corona Vigil inquisitor's dismissal in the Aurelion Vault"
  - speaker: "Roderic"
    line: "You have disrespected our Lord Lucifer and destroyed one of his paladins. Anyone who does not leave this temple immediately shall be put down by my sword."
    context: "Divine decree clearing the Chryseum of rioters"
  - speaker: "Castor"
    line: "It's been a rough day, nephew."
    context: "In beaver form, greeting the party after they descend to the shrine"

rules_clarifications:
  - topic: "Castor's shapeshifting rework"
    clarification: |
      Castor's shapeshift and resist instinct moves were replaced with a single shapeshifter move adapted from Unlimited Dungeons.
      The shift always succeeds, but the roll determines how many nature points are earned.
      On partial successes while in shifted form, a nature point must be spent to maintain the form.
      Running out of nature points forces a revert to human.
      Beaver form is exempt — Castor can always shift to beaver without cost.

