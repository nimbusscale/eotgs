entity_updates:
  - entity: "Garland yn Greenholt"
    category: "pc"
    new_info: |
      Garland fought for Beaconhold during the consolidation wars that absorbed Aurelion and neighboring city-states.
      As a reward, he was granted a fiefdom in the Ashen Vale, though Beaconhold has never enforced its authority there.
      He has visited Aurelion many times and knows multiple ways into the city.
      His herald curse — the herald of forgetting — causes knowledge to be lost and people to forget things in his proximity.
      He wears ancient plate armor beneath his tattered riding cloak — dusty, rusty, dented, and damaged from centuries of use, clanking as he walks.
      Despite his age, he proved a formidable combatant — dispatching rock rats with Second Harvest and knocking out an elite Aureate guard in close quarters.
  - entity: "Edric Bloom"
    category: "pc"
    new_info: |
      Edric is well known in Aurelion; both Captain Eisen Dorn and Mayliss Vane would recognize him.
      His herald curse — the herald of souring tales — causes stories to twist, reputations to decline, deals to go bad, and communication to break down.
      During the ritual at the Nodrum, his curse caused the tale of the Xan-Kor's defeat to shift, erasing a well-known but unnamed hero from history entirely.
      He extracted intelligence about Aurelion's underground tunnel network from Captain Dorn during a drunken evening of truth-telling games.
      He carries adventuring gear including climbing equipment, torches, and an intricate hand crossbow.
  - entity: "Castor"
    category: "pc"
    new_info: |
      Castor's herald curse — the herald of crumbling foundations — causes physical structures and objects to decay, break, and turn to dust.
      He can shapeshift into dog form (retaining beaver features — flat tail, buck teeth) and beaver form (roughly two feet tall).
      In animal form he can speak.
      His beaver sense of smell is specialized — excellent for beaver-specific scents like pheromones and territorial markers, but less effective for general tracking.
      He had taken a vow of celibacy upon first becoming a beaver, not wanting to watch short-lived children grow old and die.
      He broke this vow by mating with Tufa the rock rat in exchange for intelligence about the tunnels.
      There is concern his druidic curse could be transmitted to offspring.
  - entity: "Aurelion"
    category: "location"
    new_info: |
      Aurelion was once a crown jewel of the Imperium, famed for its gold production.
      The Imperium possessed magical or technological means to extract gold from substrate rock, knowledge lost since the Imperium's fall.
      When the gold ran out, Aurelion declined into relative unimportance, leaving it vulnerable to Beaconhold's expansion.
      Garland fought in the war that brought Aurelion under Beaconhold's control.
      The city's countryside shows decline: thin fields, sparse orchards, and a once-grand imperial road now lightly traveled.
      The city employs dog catchers to deal with a stray dog problem.
      The party is wanted in Aurelion: posters accuse them of subverting the county and stealing goods.
      Beneath the city lies a network of old mine tunnels and smuggler passages, running through abandoned gold mines that honeycomb the ground.
      Infested with rock rats and prone to cave-ins, the passages are also used by smugglers.
      A central junction — possibly a shrine or royal passage built by the city's first king — branches toward the Chryseum, Crest Aurelion, and the Mendrath Baths.
      The Mendrath Baths are a gilded bathhouse built by dwarves, accessible via the tunnels.
      The Aureate patrol the tunnels but typically assign their lowest-ranking soldiers to the duty, except when the city is on high alert.
      The Aureate tolerates smugglers in other parts of the tunnels but keeps this junction locked down.
      Dorn revealed the entrance and layout to Edric during a drinking session; the tunnels are not as secret as the Aureate believes.
      Tufa the rock rat warned of undead deeper in the passages.
  - entity: "Crest Aurelion"
    category: "location"
    new_info: |
      Crest Aurelion sits atop the city hill and serves as Count Marrow's seat.
      It resembles a vault or bank more than a traditional castle, reflecting Aurelion's identity as a gold-producing city.
      It is accessible via the underground tunnel network from the central junction.
  - entity: "The Chryseum"
    category: "location"
    new_info: |
      The Chryseum features a massive gold dome that dominates Aurelion's skyline — the last prominent reminder of the city's golden past.
      The Chryseum district is accessible via the underground tunnel network from the central junction, branching to the left.
  - entity: "Captain Eisen Dorn"
    category: "npc"
    new_info: |
      Dorn once confided to Edric during a drunken evening that Aurelion's underground is riddled with smuggler tunnels, revealing the entrance location and the layout of the central junction.
      He warned Edric never to use this knowledge, admitting he felt unusually comfortable confiding in the bard.
      His once-gilded armor now shows bare steel at stress points, and his fine cloak has been mended multiple times — signs of long service without resupply.
      His face is lined by sun and worry.
  - entity: "Beaconhold"
    category: "location"
    new_info: |
      Beaconhold consolidated power through wars, absorbing neighboring city-states including Aurelion.
      Garland and Castor fought for Beaconhold in these consolidation wars.
      After the wars, Beaconhold granted Garland a fiefdom in the Ashen Vale but has never enforced its authority there.
      Beaconhold has reached the practical limits of its expansion.
  - entity: "The Aureate"
    category: "faction"
    new_info: |
      The Aureate patrol the underground tunnel network beneath Aurelion, assigning their worst soldiers — drunks and those being punished — to general tunnel duty.
      They are aware of the tunnel network but unable to fully seal it.
      The critical junction is guarded by elite soldiers under Dorn's direct command.
  - entity: "Imperium Lucis Aeternae"
    category: "world"
    new_info: |
      Aurelion was one of the Imperium's crown jewels, a major gold producer.
      The Imperium possessed magical or technological means to extract gold from substrate rock — knowledge lost since its fall.
  - entity: "Middle Kingdoms"
    category: "world"
    new_info: |
      After the Imperium fell, the Middle Kingdoms existed as allied city-states in relative stability until a period of turmoil brought wars and consolidation.
      During this turmoil, Beaconhold absorbed its neighbors including Aurelion.

questions_raised:
  - "Why has Count Marrow issued wanted posters for the party he originally hired?"
  - "Were the tunnels beneath Aurelion truly built by the city's first king, and what was their original purpose?"
  - "Could Castor's druidic curse be transmitted to offspring?"

arc_progress:
  - arc_name: "Curse of Ruin"
    arc_type: "group"
    development: |
      The party witnessed firsthand the devastating synergy of their herald curses: a farmer forgot his family (Garland's curse), his house crumbled (Castor's curse), and no one could believe the truth (Edric's curse).
      Count Marrow issued wanted posters for all four party members, complicating their mission to reach the shrine of Renewal beneath the Chryseum.
      The party entered Aurelion covertly through the old mine tunnels, fought through rock rat ambushes, and breached past Aureate guards at a critical junction that leads toward the Chryseum district.
      Dorn's awareness of a "threat to the city" and his tightened security suggest the Aureate may know something about the dangers the party seeks to address.

notable_quotes:
  - speaker: "Captain Eisen Dorn"
    line: "I shouldn't have told you this, but I just feel so comfortable talking to you."
    context: "After drunkenly revealing the tunnel network beneath Aurelion to Edric."
  - speaker: "Castor"
    line: "I took a vow of chastity as soon as I was first transformed into a beaver. I didn't want to live through the pain of watching my children come and die."
    context: "Explaining to the party why he has never reproduced, prompted by the alluring beaver scent in the tunnels."
  - speaker: "Garland yn Greenholt"
    line: "In a far off land it was known as Halcyrax, the Gilded Ruin. When I returned to the Ashen Vale and started my farm, I beat it into a ploughshare. This legendary weapon became my farming implement that I built my farm with."
    context: "Garland describing the history of Second Harvest before entering the mines."
  - speaker: "Garland yn Greenholt"
    line: "My children and their children and their children have been both my greatest sadness and my greatest joy."
    context: "Garland reflecting on parenthood and outliving descendants, speaking to Castor."
  - speaker: "Garland yn Greenholt"
    line: "I've stuck my hand in many strange holes in my long, long years, and sometimes it's rewarding, and sometimes it's not, and the lesson to learn is that you never know until you put your hand in that hole."
    context: "Garland offering dubious wisdom to Edric about investigating the rock rat burrow."
  - speaker: "Eisen Dorn"
    line: "Do you understand how important this place is? We're okay with the smugglers getting through to the other parts of the city, but you can't be here jerking off like this. We think there might be a threat to the city."
    context: "Dorn reprimanding lazy guards at the mine junction before replacing them with elite soldiers."
  - speaker: "Edric Bloom"
    line: "As much as I love an auspicious entrance, I think not showing my face is a pretty good idea for now. I'd rather have to talk my way out of being arrested as few times as possible."
    context: "Agreeing to enter Aurelion through the mines after seeing the wanted posters."

