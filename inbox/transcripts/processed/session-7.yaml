session_number: 7
date_played: "2026-06-13"
source_transcript: "inbox/transcripts/prepared/session-7.txt"

recap_teaser: |
  Three roads had led toward the Bonewall, and one by one they ran out beneath the heralds' feet.
  Paxton waded back into the smoke of Senna's burning barge to drag a woman and child from the flames — and left a husband and a son to the fire.
  Castor came through Mira's portal as a rushing wind and glimpsed, for one clear instant, the carpenter he had been before the curse, before the Beacon, before the long centuries as a beaver.
  Garland followed and felt the forgetting close over him again like cold water.
  And on a dead grey ridge of shale, the witch stones spoke a language he had never read, while living statues watched from the crags and a small grey child fled downhill into the dark.

summary: |
  Three threads ran toward the Bonewall, and all three ended underground, in the same impossible town.

  Paxton woke from his nap in the cold river to the screaming of people he had never meant to burn.
  Wading back to Senna's sinking barge, he found a man, a woman, and a child hidden among the cargo, and the fire would only let him save one side of that family.
  He pulled the woman and her child from the window and left the husband, Roy, to the flames; the woman's son, he realized, was already the corpse he had found in the marsh.
  He cradled no illusions about what his recklessness had cost.
  The next morning, climbing toward dark Carnforth, he met a young stone-skinned creature mourning at one of the Bonewall's carved Watchers, and followed it up a trail where the only vegetation — the gnarled grey vines — had begun to move, to resist fire, to grow monstrously large.
  A vine the size of a tree batted the creature down the slope; Paxton roped it to safety at the cost of a wrenched shoulder, burned the vines from a cave mouth, and was bitten near to death by a cat-sized black spider before the rock creature smashed it away and carried his failing body down into the mountain.

  Castor and Garland spilled out of Mira's portal onto a matching ring of witch stones high on the Bonewall — stones that hummed with the same earthen energy as Garland's own but were carved in runes he could not read, their voice worn down to the faintest whisper.
  Two living statues and a small grey child scattered at their arrival, and a ring of stone-skinned people closed slowly around them, able to force out only single labored words: "child," "sequester."
  Castor opened himself to the world and felt the mountain celebrating something new; Mira, reaching for the same connection, found she could now speak the grinding stone-tongue but could no longer be understood in any human language.
  Roderic, meanwhile, fought free of an ambush at the edge of the Reaches — six men with lantern-symbol necklaces who had been sent, he learned, by someone named Roland, specifically to keep the Lightbearer from reaching the Spinewright's tomb.
  Doubling back through the mountains, he found the tomb buried under a fresh rockslide, fell through collapsing ground into an underground river, and was hauled out by the same kind of rock creatures.

  All three threads converged in a hidden town built from the petrified bodies of its own dead — the people who called themselves the Slate.
  They nursed Paxton with moss, marveled at Roderic's metal armor, and through Mira's translation finally told their story: for as long as any of them could remember, none of the Slate had aged, none had died, and none had been born — until, very recently, a single child emerged from the mountain, the first in living memory, and the whole society had broken into celebration.
  Roderic met Paxton for the first time and rejoined Garland and Castor; Garland privately recognized the sigil of Paxton's resurrection as the mark of what his youth had called the unborn, and said nothing.
  The party settled in among the dancing Slate, agreeing to make for failing Carnforth first and the buried tomb after, while Garland turned his mind to the witch stones and the ritual that might one day send Mira safely home.

major_events:
  - description: |
      Paxton waded back to Senna's burning barge after hearing screams he had not expected.
      A family had been hidden among the cargo; the fire would let him save only one part of it.
      He pulled the woman and her young child free through the window and left her husband, Roy, to burn.
      The dead body he had found earlier in the marsh, he realized, was the woman's lost son.
      The needless deaths drove home that he could not keep spending lives — his own and others' — so cavalierly.
    entities_involved: ["Paxton Lumnus", "Senna"]
    location: "The Reaches"

  - description: |
      Climbing toward Carnforth, Paxton followed a young stone-skinned creature and noticed the Bonewall's grey vines behaving wrongly — discolored, shifted, and far too large.
      A monstrous vine knocked the creature down the slope; Paxton roped it to safety, wrenching his shoulder, then burned the strangely fire-resistant vines from a cave mouth.
      A cat-sized black spider lunged from the rocks and bit him near to collapse before the rock creature crushed it and carried him down into the mountain to be healed.
    entities_involved: ["Paxton Lumnus"]
    location: "Bonewall"

  - description: |
      Castor came through Mira's portal in wind form and was struck by a vision of the valley as it was before the Beacon was built — a moment of rare clarity recalling his life as a young carpenter in the early days of the Imperium, before the long centuries as a beaver erased it.
      Shaken, he lost the wind form and reverted to human.
      Garland followed and again felt the forgetting take hold, briefly reliving — but still unable to recall — the lost memory of the note he had once given Mira to carry to Aldric.
    entities_involved: ["Castor", "Garland yn Greenholt", "Mira"]
    location: "Bonewall"

  - description: |
      On the Bonewall, Garland and Castor found a second ring of witch stones, twin to Garland's own but carved in an unreadable runic language and worn nearly silent.
      Living statues and a fleeing grey child gave way to a ring of stone-skinned people who could force out only single words.
      Castor used his bond with the world to sense the mountain's joy and goodwill; Mira reached for the same power and gained the ability to speak the grinding stone-tongue — at the cost of being unable to make herself understood in any human language.
      A recent campfire near the stones marked that some human had passed this way not long before.
    entities_involved: ["Garland yn Greenholt", "Castor", "Mira"]
    location: "Bonewall"

  - description: |
      Riding toward the Bonewall, Roderic was ambushed at the edge of the Reaches by six armed men feigning a quarrel.
      He scrutinized them, charged free on his warhorse, and saw that each wore a necklace bearing the Spinewright's lantern symbol.
      Stabling his horse, he traced them to their camp and overheard that they had been sent by someone named Roland to stop "the Lightbearer" from reaching the Spinewright's tomb — not to harm anyone else.
      They feared his arrival at the tomb would put something in jeopardy.
    entities_involved: ["Sir Roderic Lightbearer"]
    location: "The Reaches"

  - description: |
      Roderic doubled back through the southern mountains to the Spinewright's tomb — the site where his paladin company had died and the portable lantern artifact had been lost.
      He found it completely buried under a fresh rockslide.
      As he approached, the ground collapsed and dropped him into an underground river; a rock creature dragged him out into a sealed pocket, then parted the stone like clay to reveal the hidden Slate town.
    entities_involved: ["Sir Roderic Lightbearer"]
    location: "Tomb of the Spinewright"

  - description: |
      All three threads reunited in the underground town of the Slate, built from the petrified bodies of their own dead.
      The Slate nursed Paxton with moss and were fascinated by Roderic's armor.
      Through Mira's translation they revealed that for as long as any of them could remember, none had aged, died, or been born — until, very recently, a single child emerged from the mountain, the first birth in living memory, sparking a celebration.
      Roderic met Paxton for the first time; Garland silently recognized Paxton's resurrection-sigil as the mark of the "unborn."
    entities_involved: ["Sir Roderic Lightbearer", "Paxton Lumnus", "Garland yn Greenholt", "Castor", "Mira"]
    location: "Bonewall"

  - description: |
      The party resolved their next steps: with the failing Carnforth tower now closer than the buried tomb, they will make for Carnforth first and return to the Spinewright's tomb afterward.
      They settled in among the dancing Slate to rest, Paxton having been carried to the brink of death.
      Garland devoted his attention to the witch stones, intent on reproducing Mira's long-distance gate as a ritual to send her safely home.
    entities_involved: ["Sir Roderic Lightbearer", "Paxton Lumnus", "Garland yn Greenholt", "Castor", "Mira"]
    location: "Bonewall"

new_entities:
  npcs:
    - name: "Roland"
      description: |
        An unseen figure who dispatched a band of necklace-wearing men to intercept Roderic and stop him from reaching the Spinewright's tomb.
        His men referred to Roderic as "the Lightbearer" and feared Roland's anger at their failure, warning that the Lightbearer reaching the tomb would put something in jeopardy.
        His name and aims are unknown; Paxton had never heard of him among the spine wardens.
      first_location: "The Reaches"
      notes: "New antagonist working to keep Roderic away from the Spinewright's tomb; likely recurring."

  locations:
    - name: "Tomb of the Spinewright"
      type: "Landmark"
      description: |
        The tomb of the Spinewright, the Imperium hero who built the Thirteen Spines, set into the rock of the Bonewall on the valley ("good") side, roughly mid-range along the wall and separate from the Carnforth tower.
        Once filled with the Spinewright's constructs and challenges of faith, it held the portable lantern artifact Roderic's paladin company sought.
        That company was slaughtered there and the artifact lost; Roderic woke the sole survivor, remembering nothing.
        The tomb is now completely buried beneath a fresh rockslide, with an underground river running beneath it; the Slate can only enter through its main entrance, not by tunneling.
      notes: "Roderic's company died here; the portable lantern is missing. Roland's men were sent to keep Roderic from returning."

    - name: "The Slate Town"
      type: "Settlement"
      description: |
        A hidden settlement deep within the Bonewall, home to the Slate, lit by dim bioluminescent moss and reached only through the rock itself.
        Its buildings — walls, roofs, beds — are literally the petrified bodies of elder Slate who, dying of old age, rejoin the mountain by fusing into the town's architecture.
        No in-fiction name was given; the descriptive name is a placeholder.
      notes: "Unnamed in play. A sub-location within the Bonewall; the party reunited and settled in here."

  items:
    - name: "The Spinewright's Lantern"
      description: |
        A portable ward built by the Spinewright — a hand-carried version of the great wards atop the Thirteen Spines.
        Its open flame pushes back the darkness of Öuth Krelt for miles and purifies the land its light touches, though creatures must be battled back to extend that reach.
        It was the artifact Roderic's company sought in the Spinewright's tomb; it is missing, and the company never recovered it.
        Its lantern symbol appears as a necklace worn by Roland's men and, by reputation, by a chaplain from Carnforth.
      current_holder: "Unknown / missing"

  factions:
    - name: "The Slate"
      description: |
        A long-lived people of living stone dwelling within the Bonewall, who call themselves the Slate.
        They are born by emerging from the mountain with smooth, flesh-like skin; as they age their skin hardens to flexible stone and then to rigid statue, until in death they petrify completely and fuse into the architecture of their town, "rejoining the mountain."
        They move silently and gracefully over the shale, can part solid stone with their hands, and speak a slow, grinding, guttural stone-tongue; only with great effort can the younger ones force out single words of common.
        They are peaceful and hospitable, fascinated by outsiders (especially Roderic's metal armor), and revere the carved Watcher statues of the Bonewall as their own kind.
        For as long as any of them can remember, none of the Slate had aged, died, or been born — until very recently, when a single child emerged from the mountain, the first birth in living memory.

entity_updates:
  - entity: "Bonewall"
    category: "location"
    new_info: |
      The Bonewall is home to the Slate, a people of living stone who dwell in a hidden town within it, and is studded with carved "Watcher" statues the Slate treat as their own kind.
      A second ring of witch stones stands on the wall, twin to Garland's but carved in a different, unreadable runic language.
      The Spinewright's tomb is set into the wall's valley side, mid-range and separate from Carnforth.
      The wall's only vegetation — gnarled grey vines resembling grapevines — has begun to behave unnaturally near the failing wards: discolored, shifting, resistant to fire, growing to monstrous size, and even moving to strike.
      Nesting among them are cat-sized black spiders new to the Bonewall — unrecorded and unseen even by spine wardens like Paxton — apparently emerging alongside the vines' mutation.
      The land carries a "natural unnaturalness," a dread that deepens toward Öuth Krelt as the wards fail.

  - entity: "Witch Stones"
    category: "location"
    new_info: |
      A second ring of witch stones stands high on the Bonewall, matching the configuration of Garland's stones in the Ashen Vale and reached via Mira's portal.
      They hum with the same earthen energy and feel familiar to Garland, but are carved in a completely different runic language — recognizable as kin yet unreadable, "like English versus Korean."
      Garland's connection to them is faint and distant, like a worn-out battery beside a fresh one, suggesting the stones may form a wider network and hold secrets he has not learned.

  - entity: "Carnforth"
    category: "location"
    new_info: |
      A chaplain stationed at Carnforth was, by reputation, known to wear the Spinewright's lantern as a necklace — the same symbol now worn by Roland's men.
      What the necklace signifies has not been revealed in play; the players suspect a cult or hidden order centered on the failing northern spine, but that remains only their theory.

  - entity: "Mira"
    category: "npc"
    new_info: |
      Mira's bond with the witch stones has deepened: she heard them "calling," promising safety, and had dreamed of the Bonewall site as she once dreamed of Garland's stones before tearing open the portal to it.
      She can now cast Tongues, channeling the stones; when she does on the Slate, she speaks their grinding stone-tongue but cannot be understood in human language, and she serves as the party's translator with the Slate.
      A sanctuary she can establish counts as a home for those bonded to her through the stones.

  - entity: "Castor"
    category: "pc"
    new_info: |
      Passing through Mira's portal in wind form triggered a vision of clarity: Castor briefly recalled his life as a young carpenter in the early days of the Imperium, before the long centuries as a beaver erased those memories.
      He can extend his "At One With The World" bond toward the Slate, reading the mountain's and the creatures' intent as wordless "vibes" rather than speech.

  - entity: "Garland yn Greenholt"
    category: "pc"
    new_info: |
      Garland recognizes the sigil marking Paxton's resurrection as the mark of what his youth called the "unborn" — those reborn through the Light — but keeps this knowledge to himself rather than confronting Paxton.
      Having witnessed Mira's grasping-gate and studied the Bonewall witch stones, he intends to recreate that long-distance gate as a ritual to send Mira safely home.
      The forgotten memory of the note he gave Mira for Aldric resurfaced again on passing through the portal, but its contents remain lost to him.

  - entity: "Paxton Lumnus"
    category: "pc"
    new_info: |
      Paxton served as a regular spine warden, not a chaplain; he once saw a chaplain stationed at Carnforth wearing the lantern necklace.
      He reunited with Garland and Castor and met Roderic for the first time.
      His spontaneous resurrection is confirmed to be genuinely rare and ill-understood — divine, unrelated to any ritual, and unlike Senna, who was not raised from death but transformed and "reborn" only in a metaphysical sense in the vision of Moldrex.

  - entity: "Sir Roderic Lightbearer"
    category: "pc"
    new_info: |
      A figure named Roland sent men wearing the Spinewright's lantern necklace to intercept Roderic and keep him from reaching the Spinewright's tomb, fearing his return would put something in jeopardy.
      Roderic returned to the tomb — the site of his company's massacre — to find it buried under a rockslide, and reunited with Garland and Castor while meeting Paxton for the first time.

  - entity: "The Spinewardens"
    category: "faction"
    parent_file: "factions/spinewardens.md"
    new_info: |
      The spine wardens are part of Beaconhold's military rather than the church — religious in devotion but not under clerical control.
      They do not normally leave their spines except to carry messages, and kidnapping is far outside their conduct.
      They do not wear the Spinewright's lantern as a necklace; those who do are anomalous, as with the chaplain reputed to wear one at Carnforth — what it signifies remains unrevealed.

  - entity: "Senna"
    category: "faction"
    parent_file: "factions/spinewardens.md"
    new_info: |
      Senna was not literally killed and resurrected as Paxton was.
      Her "rebirth" in the vision of Moldrex was a metaphysical transformation she accepted — a born-again change, not a death and return.

questions_raised:
  - "Who is Roland, and why is he so determined to keep Roderic from the Spinewright's tomb? What is in the tomb now?"
  - "Why has the Slate's long stasis — no births, deaths, or aging — broken now, and what does the first child in living memory signify? Is it an echo of the God of Renewal's awakening?"
  - "Who left the recent campfire beside the second ring of witch stones on the Bonewall?"
  - "Why are the Bonewall's grey vines mutating — moving, resisting fire, growing huge, and harboring giant spiders? Is it Öuth Krelt's corruption seeping through the failing wards?"
  - "What does the lantern necklace mean, worn by Roland's men and by a Carnforth chaplain — a cult, a splinter order, or something tied to the failing wards? (Unrevealed in play; players are still only theorizing.)"
  - "Do the witch stones form a network spanning the Ashen Vale and the Bonewall, written in an older or different language, and what secrets do the Bonewall stones hold?"
  - "Why did the newborn Slate child flee from the party, and why do the rigid Watcher statues pursue it?"

questions_resolved:
  - question: "What was the magic item Roderic's company sought in the Spinewright's tomb?"
    answer: |
      The Spinewright's Lantern — a portable version of the great wards atop the Thirteen Spines.
      Its open flame pushes back the darkness of Öuth Krelt for miles and purifies the land its light touches.
      It is missing, and Roderic's company never recovered it before they were killed.
    session_established: 7

  - question: "Did Senna die and return the way Paxton did?"
    answer: |
      No.
      Senna was not killed and resurrected; she was transformed and "reborn" only in a metaphysical sense in the vision of Moldrex, a change she accepted.
      Paxton's spontaneous resurrection is genuinely rare, divine, and unrelated to any ritual.
    session_established: 7

  - question: "Why are the Bonewall wards and the Thirteen Spines failing?"
    answer: |
      The failure is a side effect of Sariel's erasure from history, compounded by the party — the heralds of ruin — whose ruinous energies impacted that unmaking.
      The towers began going dark as a consequence of that same scene.
    session_established: 7

arc_progress:
  - arc_name: "The Forgotten and the Forsaken"
    arc_type: "group"
    development: |
      The three scattered threads finally converged: Paxton, Roderic, and the Garland–Castor–Mira group all came together underground in the hidden town of the Slate, reuniting the party (minus Edric) and adding Paxton to the group in play.
      Each had found the Bonewall's rot wearing a different face — Paxton the mutating vines and stone creatures, Roderic the necklace-wearing men sent by Roland, and Garland and Castor the silent second ring of witch stones.
      A new mystery surfaced in the Slate, whose ageless, deathless, birthless stasis has suddenly broken with a single newborn child.
      The party set their course: failing Carnforth first, then the buried Spinewright's tomb.

notable_quotes:
  - speaker: "Garland yn Greenholt"
    line: "Forgetting is fine, but remembering that you forgot — I'm done with that."
    context: "Coming through the portal and feeling the curse take a memory from him again."

  - speaker: "Garland yn Greenholt"
    line: "These are the same bones of the earth that I've spent the last several hundred years with. But the language is different."
    context: "Touching the second ring of witch stones on the Bonewall."

  - speaker: "Garland yn Greenholt"
    line: "A hungry man seems happy for the appearance of a meal as well."
    context: "Warning Castor against trusting the welcoming Slate."

  - speaker: "Paxton Lumnus"
    line: "Our history is written in our city."
    context: "Realizing the Slate keep no written records — their past is the petrified bodies that form their town."

  - speaker: "Paxton Lumnus"
    line: "You look stabby."
    context: "Accepting Mira's confiscated dagger as a borrowed weapon."

rules_clarifications:
  - topic: "Decree (Devout Virtue)"
    clarification: |
      Decree commands only a single enemy to surrender or repent, not a whole group — correcting an earlier ruling that had let Roderic decree multiple foes at once.

  - topic: "Eyes of the Faithful"
    clarification: |
      Eyes of the Faithful (used via Scrutinize/Examine) always reveals a guilt or transgression on its target; it is meant to be turned on those who have done wrong, not as a neutral sense-motive to determine whether someone is good or bad.

