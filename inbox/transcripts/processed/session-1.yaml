rules_clarifications:
  - topic: "Rituals vs. Spells"
    clarification: |
      Rituals can accomplish complex effects beyond even potent spells,
      but require preparation — anchors, rights, and understanding of
      the ritual's components. They cannot be performed on the fly.
      Roderic's consecration rights are a prerequisite for rituals, not
      a standalone power. Consecrating a body of water to resist ruin
      would require a full ritual, not just a spell.

  - topic: "Power Pools"
    clarification: |
      Power pools (like Roderic's healing pool) are rolled in place of
      a stat. A grim result on a power pool means the pool is exhausted
      for the session and the GM makes an impact move. Power pools return
      at the start of the next session. They are distinct from resource
      pools and timer pools.

  - topic: "Castor's Animal Communication"
    clarification: |
      Not magical speech — behavioral and gestural communication from
      years living as a beaver. Works well with beavers specifically.
      Can convey urgency and general concepts but not nuance. Other
      animals may be communicated with less effectively.

  - topic: "Castor's Shapeshift Forms"
    clarification: |
      All of Castor's animal forms retain subtle beaver characteristics
      (beaver tail on horse, beaver feet on giraffe). His true form is
      beaver. Wild shape is a power pool that resets every scene.

  - topic: "Story Points"
    clarification: |
      Players can spend story points to establish narrative facts. Used
      this session to establish: the abandoned fisher's hut at Beaver
      Lake, Farlands Pass as a named location. Story rolls (2d) determine
      how established details play out.

  - topic: "Roderic's Status with the Church"
    clarification: |
      Roderic is on assignment as a knight errant — not resigned or on
      sabbatical. He retains the authority and recognition of a paladin
      of the Church of Lucifer but does not currently command a battalion.
      He reports to a superior and is tasked with redemption through
      deeds. His order is "The Redeemers of Light."

  - topic: "Messy Results"
    clarification: |
      A messy result is a success that also allows the GM to make an
      impact move — complicating things, escalating the situation, or
      introducing a problem. The action still succeeds.

