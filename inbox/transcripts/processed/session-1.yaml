date_played: "2026-01-24"
source_transcript: "inbox/transcripts/prepared/session-1.txt"

recap_teaser: |
  Behind them, Ashbrook crumbles to dust. Before them, a cursed river
  races toward the Great Beaver Dam — and beyond it, everything they love.

summary: |
  The party stood on the mountainside above the ruins of Ashbrook — once
  called Eld Ashara, the Place of Unmaking — watching the town collapse
  into decay behind them. They had removed the Seal of Unmaking from its
  altar beneath the town's spring, and in doing so released the imprisoned
  force of Ruin into the headwaters of the Ashen Flow. The cursed water
  now raced downstream toward the Great Beaver Dam, and beyond it, the
  Ashen Vale and Crownvale — home to people Garland and Castor cared
  deeply about.

  Desperate to outrun the corruption, the party rode hard through the
  Cinderwall mountains. Along the way, they were stopped by a pack of
  dire coyotes — shapeshifters blessed by the Wild Hunt, one of the old
  gods. The coyote leader demanded the Seal, claiming the party was
  carrying ruin through their hunting grounds. Through persuasion and
  bardic storytelling, Roderic and Edric convinced the pack to let them
  pass, though the price was steep: a horse, which Garland soothed with
  an illusion spell before surrendering it to the hungry pack.

  Riding through the night, the party reached Beaver Lake by morning.
  They split their efforts: Castor shifted into beaver form and convinced
  the colony to evacuate downstream, wielding a stick — a sign of
  authority in beaver society — and slapping his tail urgently to convey
  the danger. Garland, assisted by Edric's bardic melody, erected a
  spirit wall across the river to filter the ruin from the water. The
  barrier held, though imperfectly — the corruption began pooling at the
  barrier site, creating a new concentration of ruinous energy that would
  eventually overwhelm the ward. Meanwhile, Roderic attempted to heal the
  exhausted horses by calling upon Lucifer's light, but the proximity of
  ruin overwhelmed his divine power. The horses withered and aged before
  his eyes, deepening his crisis of faith.

  With no mounts and the party exhausted, Garland recalled an abandoned
  fisher's hut on the lakeshore where they could rest. During the night
  watch, the hut's foundations crumbled — whether from age or the creeping
  influence of ruin — and Castor, standing watch in giraffe form, felt a
  growing doubt about his own craftsmanship. As the party prepared to
  leave, Garland spotted a scrap of fabric bearing the livery of his
  grandson Aldric, snagged in the reeds by the lake — fresh, as if
  someone connected to Aldric had been there recently. Combined with the
  letter from Rowan mentioning someone dressed in Aldric's livery near
  Ashbrook before the disaster, suspicion fell on the ambitious young lord.

  Walking through the Ashen Vale toward Crownvale, the party encountered
  a merchant named Jacob whose preserved fish had inexplicably rotted.
  His young daughter spoke disturbingly of endings as natural and
  comfortable things. Edric purchased a barrel of the ruined fish and a
  cart, planning to sell it as fertilizer. The party debated whether the
  girl's words reflected the spreading influence of ruin on the minds of
  ordinary people. Roderic warned against reinforcing the philosophy of
  "new beginnings through destruction," fearing it empowered ruin further.

  Arriving in Crownvale, the party moved quickly. Garland, keeping his
  hood drawn to avoid recognition, purchased horses. Edric distracted
  Aldric's guards — including Sergeant Iyer — by buying them drinks at
  the tavern, where he pumped them for information. He came away convinced
  Aldric was not involved in the ruin's release. However, Edric experienced
  a disturbing vision of Sergeant Iyer's marital troubles and felt an
  almost irresistible compulsion to weaponize that knowledge — a whisper
  of ruin's influence that he barely resisted. Mira, Aldric's ten-year-old
  daughter, recognized Garland despite his disguise, and he slipped her a
  letter warning Aldric of the approaching danger.

  A brief complication arose when the horse seller, Laura, accused Garland
  of theft — apparently confused or manipulated — but the guards recognized
  Garland and dismissed the claim. The townspeople began turning against
  Laura, but Roderic intervened with a stirring blessing, urging compassion
  and attributing her confusion to the corrupting influence spreading
  across the land. The party departed Crownvale on fresh horses, headed
  for Beacon Hold to seek counsel from the Church of Lucifer and the
  Wizard's College, knowing that Garland's spirit wall would not hold
  forever.

major_events:
  - description: |
      The party fled the ruins of Ashbrook on horseback, racing the cursed
      river downstream through the Cinderwall mountains toward the Great
      Beaver Dam.
    entities_involved: ["Castor", "Roderic", "Edric", "Garland"]
    location: "Cinderwall"

  - description: |
      A pack of dire coyotes — shapeshifters blessed by the Wild Hunt —
      blocked the mountain road, demanding the Seal of Unmaking. Their
      leader, a half-shifted man with black eyes, claimed the party was
      carrying ruin through their hunting grounds. Through Roderic's
      appeals and Edric's bardic storytelling, the party convinced the
      coyotes to let them pass in exchange for a horse.
    entities_involved: ["Roderic", "Edric", "Garland", "Castor"]
    location: "Cinderwall"

  - description: |
      Garland cast an illusion on Castor's horse, letting it believe it
      was frolicking in the pastures of Greenholt, before surrendering it
      to the dire coyotes as payment for passage. Castor rode double with
      Garland for the rest of the journey.
    entities_involved: ["Garland", "Castor"]
    location: "Cinderwall"

  - description: |
      Arriving at Beaver Lake by morning, the party split their efforts.
      Castor shifted into beaver form and entered the colony's burrows,
      wielding a stick — a sign of authority — to convince the beavers to
      evacuate downstream. The beavers respected the stick and fled over
      the dam into the lower Ashen Flow.
    entities_involved: ["Castor"]
    location: "Beaver Lake"

  - description: |
      Garland, with Edric singing a supportive melody, cast a potent
      spirit wall across the river upstream of the lake to filter the
      corruption from the water. The barrier held but imperfectly — it
      blocked the ruin, but the corrupted energy began pooling at the
      barrier site, creating a growing concentration of ruinous force
      that would eventually overwhelm the ward.
    entities_involved: ["Garland", "Edric"]
    location: "Beaver Lake"

  - description: |
      Roderic called upon Lucifer's light to heal the exhausted horses,
      but the proximity of ruin overwhelmed his divine power. The horses
      withered and aged before his eyes, leaving the party without mounts.
      Roderic knelt over the fallen animals and prayed, his faith shaken
      further by his inability to protect even these creatures.
    entities_involved: ["Roderic"]
    location: "Beaver Lake"

  - description: |
      During the night watch at an abandoned fisher's hut, the hut's
      foundations crumbled. Garland discovered a scrap of fabric bearing
