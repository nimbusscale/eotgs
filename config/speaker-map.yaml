# Transcription corrections - case-insensitive replacements
# Add new entries as you discover speech-to-text errors
transcription_corrections:
  # Character name mishearings
  - match: "Roderick"
    replace: "Roderic"
  - match: "kather"
    replace: "Castor"
  - match: "Katherine"
    replace: "Castor"
  - match: "Castro"
    replace: "Castor"
  - match: "Garlin"
    replace: "Garland"
  - match: "Edrick"
    replace: "Edric"
  - match: "Arulian"
    replace: "Aurelion"
  - match: "Rulian"
    replace: "Aurelion"

  # Add location/term corrections as discovered
  # - match: "grim wild"
  #   replace: "Grimwild"

  # --- Session 6 names (rough phone-app transcription) ---
  # Safe, distinctive mishearings (no real-word collision):
  - match: "mouldrex"
    replace: "Moldrex"
  - match: "mouldrec"
    replace: "Moldrex"
  - match: "sergeant ire"
    replace: "Sergeant Iyer"
  - match: "sergeant iron"
    replace: "Sergeant Iyer"
  - match: "sarial"
    replace: "Sariel"
  - match: "hallowech"
    replace: "Hallowreach"
  - match: "griswold"
    replace: "Griswald"
  - match: "griswalt"
    replace: "Griswald"
  - match: "sanna"
    replace: "Senna"
  - match: "vasques"
    replace: "Vasque"
  - match: "vascus"
    replace: "Vasque"
  # Real-word collisions — the hero Sariel was heard as "serial"/"cereal" this
  # session. Plot-critical, so corrected here; review/remove if a future
  # session uses these words literally.
  - match: "cereal"
    replace: "Sariel"
  - match: "serial"
    replace: "Sariel"

  # --- Session 8 names (the Slate town Muistola, Finnish-rooted) ---
  # Corrections are raw case-insensitive substring replacements (no word
  # boundaries), so only DISTINCTIVE mishearings are listed here. The shortest
  # canonical names — Aamu, Itu, Routa, Lohka — are NOT auto-corrected from their
  # bare mishearings (Amu, Ito, Rota, Loka/Loca), because those fragments occur
  # inside ordinary words ("amused", "monitor", "rotate", "located"). Catch those
  # by hand at extraction instead.
  - match: "Vallo"
    replace: "Vaalo"
  - match: "Halvey"
    replace: "Holvi"
  - match: "Holvey"
    replace: "Holvi"
  - match: "Hallvey"
    replace: "Holvi"
  - match: "Holby"
    replace: "Holvi"
  - match: "Kalillo"
    replace: "Kallio"
  - match: "Calillo"
    replace: "Kallio"
  - match: "Kalilo"
    replace: "Kallio"
  - match: "Kaleo"
    replace: "Kallio"
  - match: "Amio"
    replace: "Aamu"
  - match: "Rotu"
    replace: "Routa"
  - match: "Itsu"
    replace: "Itu"
  - match: "Sauvignon"
    replace: "Syvämaa"
  - match: "Savinat"
    replace: "Syvämaa"
  - match: "Massula"
    replace: "Muistola"
  - match: "Masola"
    replace: "Muistola"
  - match: "swonet"
    replace: "Suonet"
  - match: "swownet"
    replace: "Suonet"
  - match: "squeenet"
    replace: "Suonet"
  # Real-word collisions — corrected here because they are plot names this
  # campaign, but review/remove if a future session uses the word literally:
  - match: "Helios"
    replace: "Hiillos"
  - match: "David"
    replace: "Dafydd"
