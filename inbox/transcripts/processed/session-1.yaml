      someone connected to Aldric had been there very recently.
    entities_involved: ["Garland", "Castor"]
    location: "Beaver Lake"

  - description: |
      On the road through the Ashen Vale, the party encountered a merchant
      named Jacob whose preserved fish had inexplicably rotted. His young
