# Maps KB entity (subdir/slug) -> images.
# Image files live in images/ (repo root, gitignored). Copied into the site
# at build time by scripts/build_site.py.
#
# Optional `hero`: rendered at the top of the page with no caption (it is
#   self-evidently the subject of the page). `alt` is for accessibility only.
# `gallery`: list rendered in a "## Gallery" section; each image shows its
#   `caption` beneath it.
# Omit `hero` to send every image to the gallery — use this for pages where
# no single image represents the whole entity (e.g. faction pages).
#
# `library`: optional list (sibling to `hero`/`gallery`) of reference-only
#   images that must NOT be published to the site (e.g. studio reference plates
#   used to drive image generation). build_site.py never publishes these; they
#   exist here so the illustrate-scene skill can find a character's identity
#   reference and its prompt spec.
#
# Per image item (in `hero`, `gallery`, or `library`):
#   file:    repo-relative path under images/ (required)
#   caption: shown beneath gallery images
#   alt:     accessibility text for hero images
#   description: (optional) a fuller account of what is in the picture. The
#     illustrate-scene skill reads this to choose which reference best fits a
#     moment (e.g. weapon-free vs. armed, which location view to use).
#   prompt:  (optional) repo-relative path to that image's spec JSON in
#     config/image/prompts/. Links a published image back to the prompt that
#     produced it, and lets the skill load a reference's canon sub-prompt.

pcs/castor:
  hero:
    file: pcs/castor-human.jpg
    alt: "Castor in human form"
    description: "Castor in human (wood-elf) form: shaggy red-orange hair, tattered earth-toned traveler's outfit, ragged hooded cloak. No weapon. Front-facing identity reference."
    prompt: config/image/prompts/castor-reference-plate-prompt.json
  gallery:
    - { file: pcs/garland-and-castor-beaver.jpg, caption: "Garland cradling Castor in his true beaver form" }

pcs/garland-yn-greenholt:
  hero:
    file: pcs/garland-portrait.jpg
    alt: "Garland yn Greenholt"
    description: "Garland's face and identity: extraordinarily old warrior-sage, elven pointed ears, weathered sun-lined skin. Portrait framing, no weapon prominent. Primary identity reference."
    prompt: config/image/prompts/garland-reference-plate-prompt.json
  gallery:
    - file: pcs/garland-second-harvest.jpg
      caption: "Garland walks the vale, Second Harvest in hand"
      description: "Garland holding his signature sword Second Harvest (broad forward-curved pattern-welded blade). Use when the moment calls for him armed."
    - { file: pcs/garland-and-castor-beaver.jpg, caption: "The old guardian and his beaver kin" }

pcs/paxton-lumnus:
  hero:
    file: pcs/paxton-portrait.jpg
    alt: "Paxton Lumnus"
    description: "Paxton's face and divine light-marks (gold line through his RIGHT eye/cheek): dark near-black hair, dark stubble, pale gold-touched eyes. Weapon-free portrait — prefer this as the identity reference for non-combat / weapons-hidden scenes."
    prompt: config/image/prompts/paxton-reference-plate-prompt.json
  gallery:
    - { file: pcs/paxton-and-the-light.jpg, caption: "Paxton unleashes the Light against the pack" }
    - file: pcs/paxton-pose.jpg
      caption: "Bearing the dawn's burden across broken country"
      description: "Full-body Paxton in weathered brown leather road armor with sword at side. Armed reference; for weapon-free scenes use the portrait instead."

pcs/sir-roderic-lightbearer:
  hero:
    file: pcs/roderic-pose.jpg
    alt: "Sir Roderic Lightbearer"
    description: "Sir Roderic, young blond knight in bright polished silver-steel plate with gold filigree, heraldic-blue surcoat, blue kite shield with gold rampant lion. Strong bright canonical palette. Primary identity reference."
    prompt: config/image/prompts/roderic-reference-plate-prompt.json
  gallery:
    - { file: pcs/roderic-horse.jpg, caption: "The Lightbearer rides for the failing wards" }

