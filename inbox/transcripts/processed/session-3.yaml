recap_teaser: |
  Deep in the Nodrum, the Triune delivered a truth no one wanted to hear.
  The corruption is not in the river.
  It is not in the soil.
  It is in you.
  You are the heralds of ruin, and everywhere you ride, the world rots a little faster.
  But the sisters offered more than despair.
  They spoke of a counterpart: a God of Renewal, long absent, whose return might restore the balance shattered when the Seal of Unmaking was broken.
  And they pointed the way.
  A forgotten shrine, buried beneath the holiest cathedral in Marrow County — the Chryseum.

  Then came the laughter.
  A Harlequin named Jimmy confessed that the Laughing One has been watching since Ashbrook.
  The scraps of Aldric's livery, the paranoia, the feeling of being followed.
  All of it was entertainment.
  And the Dark Harlequin, that thing with the checkered face and the mouth full of teeth, sent Garland a vision of children daring each other to leap from the parapets of Aldric's castle.
  It wanted him to turn back.
  But old Garland pressed forward, even as something precious began to slip from his memory like water through cupped hands.

  Now the road leads to Aurelion.
  The seat of Count Marrow's power, where Luminary Severin preaches that storytellers are the enemy and the Aureate enforce his word in tarnished golden armor.
  Somewhere beneath that cathedral lies a shrine to a god the church buried and forgot.
  Four plague-carriers, walking into the most heavily guarded city in the county, seeking a forbidden temple beneath the feet of a priest who would see them silenced.
  What could possibly go wrong?

summary: |
  The road to Aurelion offered the party their first true glimpse of what they carry.
  A farmer stood blank-eyed on a dusty path, unable to remember his own wife and child while his farmhouse sagged and splintered behind him.
  The neighbors could not make anyone believe the truth of what had happened.
  The party rode past in grim silence, recognizing themselves as the cause — Garland the herald of forgetting, Castor of crumbling foundations, Edric of souring tales, and Roderic, traveling separately, of failing wards.

  Aurelion rose before them: the golden dome of the Chryseum still catching light above a city long past its golden age, Crest Aurelion perched on the hill like a vault rather than a castle, and a countryside of thin fields and abandoned mines.
  Wanted posters bearing all four of their likenesses lined the road, accusing them of subversion and theft on behalf of Count Marrow.
  Castor shifted into a dog to hide his face, but Garland proposed a different approach entirely — the old mines beneath the city, whose tunnels Edric had learned about during a drunken evening with Captain Eisen Dorn.

  They entered the mines and descended into darkness, Garland conjuring light and wards while Castor shifted into beaver form to scout.
  At a fork in the tunnels, Castor caught the unmistakable scent of a beaver in heat — impossibly out of place underground — and followed it to a burrow where he struck a bargain with a rock rat named Tufa, trading his long-held vow of celibacy for intelligence about the tunnels ahead.
  Tufa warned of undead deeper in the passages and of rock rats that ambush anyone carrying light.
  Undeterred, the party pressed on with torches lit, ready to face whatever came — and face it they did: rats dropped from the ceiling, wounding Garland through his ancient armor and biting deep into Castor's throat, stealing his voice to a ragged whisper.

  Pressing on, the party discovered a new wooden door guarded by Aureate soldiers — and then watched from the shadows as First Aureate Eisen Dorn himself arrived to replace the idle guards with his best soldiers, warning of a threat to the city.
  Edric, invisible under Garland's spell, failed to slip through behind Dorn and alerted the new guards.
  Garland conjured an illusion of glowing rock rats to split the sentries, allowing Edric to finally dart through.
  When a rock rat attacked from behind, Castor grappled it off Garland, who then stepped from the shadows, conjured a halo of light behind his head, and knocked an elite Aureate guard unconscious with a single blow from Second Harvest — his ancient sword that ignores armor.
  All three stumbled through the door to rejoin Edric on the far side, battered but alive, one step closer to the shrine of Renewal beneath the Chryseum.

major_events:
  - description: |
      As the party rode through the countryside toward Aurelion, the curse of ruin manifested around them.
      A farmer stood lost on a dusty road, unable to remember his own wife and child who wept behind him.
      His farmhouse sagged and splintered, its foundations giving way.
      The neighbors could not convey the truth of the disaster to anyone who would believe them.
      The party watched in grim silence, recognizing themselves as the cause.
    entities_involved: ["Garland yn Greenholt", "Edric Bloom", "Castor"]
    location: "Marrow County"
  - description: |
      The party approached Aurelion and took in the city for the first time.
      The golden dome of the Chryseum dominated the skyline, the last vestige of the city's former wealth as a gold-producing jewel of the Imperium.
      Crest Aurelion sat atop the hill like a vault rather than a castle.
      The surrounding countryside showed decline: thin fields, sparse orchards, and a once-grand imperial road now sparsely traveled.
      Wanted posters bearing all four party members' likenesses lined the road, accusing them of subverting the county and stealing goods on behalf of Count Marrow.
    entities_involved: ["Garland yn Greenholt", "Edric Bloom", "Castor", "Sir Roderic Lightbearer", "Count Albrecht Marrow"]
    location: "Aurelion"
  - description: |
      Castor shapeshifted into a dog with beaver-like features — a flat wide tail and large buck teeth — to avoid recognition from the wanted posters.
      Garland proposed entering through the old gold mines rather than the gates, given his distinctive elven features and Edric's notoriety in the city.
      Edric recalled a drunken evening with Captain Eisen Dorn during which Dorn revealed that beneath Aurelion lay a network of smuggler tunnels through old mines.
      At a central junction — possibly a shrine or royal passage built by the city's first king — the tunnels branched toward the Chryseum district, Crest Aurelion, and the Gilded Bathhouse.
      Dorn had warned Edric never to use the tunnels, but Edric remembered every detail.
    entities_involved: ["Castor", "Garland yn Greenholt", "Edric Bloom", "Captain Eisen Dorn"]
    location: "Aurelion"
  - description: |
      The party entered the mine entrance outside Aurelion.
      Garland conjured a floating ball of light and wove a protective ward against falling debris.
      Castor, in dog form, immediately detected heavy recent traffic — the tunnels were not as secret as the Aureate believed.
      Garland described his signature weapon: a great sword called Second Harvest, originally a legendary blade called Houseracks the Gilded Ruin taken as a spoil of war.
      He had beaten it into a ploughshare to build his farm, melted out its gold inlay during a harsh winter to feed the vale, and reforged it into a sword when he left home again.
      Where the gold once lay, the blade now glowed with a sense of dread — the omen that compelled Garland to leave his home.
    entities_involved: ["Garland yn Greenholt", "Edric Bloom", "Castor"]
    location: "Aurelion Tunnels"
  - description: |
      At a fork in the tunnels, Castor shifted from dog to beaver form.
      The alluring sweet scent from the right passage transformed into something unmistakable: the pheromone trail of a beaver in heat, exotic and impossible in a mine.
      Garland cast invisibility on Castor and sent the beaver ahead as a scout.
      Castor discovered a small hole in the tunnel wall — large enough for a beaver but far too small for a human — where the scent was strongest.
    entities_involved: ["Castor", "Garland yn Greenholt"]
    location: "Aurelion Tunnels"
  - description: |
      Castor, invisible and in beaver form, encountered a large rock rat named Tufa in a small burrow — a mother of three litters with teeth that could gnaw through stone.
      Tufa agreed to share intelligence about the tunnels in exchange for Castor's company, a bargain that broke Castor's self-imposed vow of celibacy — one he had held since first being transformed into a beaver, unwilling to watch short-lived children grow old and die.
      Tufa revealed that undead lurked deeper in the tunnels — people long dead who still walked — and that rock rats ambush anyone carrying light by dropping from ceiling holes.
    entities_involved: ["Castor"]
    location: "Aurelion Tunnels"
  - description: |
      Rock rats ambushed the party by dropping from the ceiling.
      Garland stood firm as two rats landed on him, his ancient plate armor absorbing the initial blow as claws tore through buckles and straps.
      He drew Second Harvest and dispatched both, flinging a dead one into the rat clinging to Castor's throat.
      A rock rat had sunk its teeth deep into Castor's neck, leaving him barely able to speak above a whisper.
      Edric spun and killed a rat with his hand crossbow but his leg fell into a burrow hole, leaving him off-balance.
    entities_involved: ["Garland yn Greenholt", "Castor", "Edric Bloom"]
    location: "Aurelion Tunnels"
  - description: |
      Garland made Edric invisible, and the bard crept forward to scout.
      He discovered two guards stationed at a barrel near a wooden door — notably made of new wood, not the rotting timber found elsewhere, suggesting an active and maintained passage beyond.
      Then First Aureate Eisen Dorn emerged from behind the door with two senior guards.
      He reprimanded the recruits for gambling on duty, warning them of the importance of the location and a potential threat to the city.
      He replaced them with his best soldiers and sent the recruits to clean latrines.
    entities_involved: ["Edric Bloom", "Garland yn Greenholt", "Eisen Dorn"]
    location: "Aurelion Tunnels"
  - description: |
      Edric attempted to dart through the door before it closed but slammed against it, alerting the elite guards.
      Still invisible, he fled back to regroup with Garland and Castor.
      Garland conjured a glowing illusion of mating rock rats down a side tunnel to lure one guard away.
      Edric, still invisible, slipped past the remaining guard and lit a torch on the far side of the door.
    entities_involved: ["Edric Bloom", "Garland yn Greenholt"]
    location: "Aurelion Tunnels"
  - description: |
      A rock rat leapt onto Garland, but Castor launched himself at the creature, grappling it off and driving it away despite taking wounds.
      Garland stepped from the shadows, conjured a halo of light behind his head, and advanced on the remaining guard.
      He struck the soldier with the flat of Second Harvest — an enchanted blade that ignores armor — and knocked the guard unconscious with a single blow, though the guard slashed him in return.
      Garland grabbed Castor and they rushed through the door to rejoin Edric on the other side.
    entities_involved: ["Garland yn Greenholt", "Castor", "Edric Bloom"]
    location: "Aurelion Tunnels"

