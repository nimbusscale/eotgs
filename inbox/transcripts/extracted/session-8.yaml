gm_observations:
  - "Aamu's grief read clearly to Castor's stone-vision (the 'deep trauma sadness'), but its true source — the hidden stillborn dead in the Gallery of the Lost, known only to Aamu — never surfaced in play. Keep that secret GM-only; the party has only sensed that something weighs on Aamu."
  - "GM-only — the Roland seed: the forgotten figure Roderic sensed in his stone-vision (as vital as Lucifer, explicitly NOT Sariel) is the planted hook for Roland, the erased-ascension contender who did not ascend when Lucifer did (see gm-notes/session-8-and-beyond.md). Do NOT reveal to the players — it stays a nameless mystery on their side."
  - "Moldrex is winning converts among the Slate faster than the party can counter — Holvi wavered and Lohka's faction hardened within a single scene, suggesting the corruption spreads through belief as much as through the vines."
  - "Lohka's exposed flesh beneath the cracking stone is the devolution mechanic made visible: rival Slate trade stone for Moldrex's soft, perishable flesh, becoming 'stronger, freer' and more vulnerable at once."
  - "The realm-of-the-forgotten ritual establishes a reusable, costly mechanism: the witch stones can reach the place where erased things persist, which may be the route to recovering Vaalo, Sariel, or lost memories later — at the price of being seen by the forgetting."

